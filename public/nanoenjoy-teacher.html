<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoSyllabus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --wash:#F7F7F6; --ink:#0B0B0B; --ink-2:#565654; --ink-3:#8C8C89;
  --rule:#E3E3E0; --rule-2:#EFEFEC;
  /* the only colours in the product: how well a topic is known */
  --red:#C43D2E; --yellow:#E0A800; --green:#2E7D4F; --grey:#C8C8C5;
  --shadow:0 1px 0 rgba(0,0,0,.03), 0 10px 26px -22px rgba(0,0,0,.55);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--wash); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
h1,h2,h3{font-family:var(--display); margin:0; font-weight:600; letter-spacing:-.025em}
h1{font-size:28px; letter-spacing:-.04em}
h2{font-size:19px}
h3{font-size:16px}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:4px}

.app{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
.rail{border-right:1px solid var(--rule); background:var(--paper); position:sticky; top:0; height:100vh; overflow:auto; padding:18px 13px 40px;
  display:flex; flex-direction:column}
.brand{display:flex; gap:10px; align-items:center; padding:2px 8px 18px}
.brand .glyph{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.brand b{font-family:var(--display); font-size:17px; letter-spacing:-.035em; font-weight:600}
.navgroup{margin:16px 0 5px; padding:0 9px; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-3)}
.navitem{display:flex; align-items:center; gap:9px; width:100%; padding:8px 11px; border-radius:9px; border:1px solid transparent;
  background:none; color:var(--ink-2); cursor:pointer; font-size:14px; text-decoration:none}
.navitem:hover{background:var(--wash); color:var(--ink)}
.navitem.on{background:var(--ink); color:#fff; font-weight:500}
.navitem .n{margin-left:auto; font-size:11.5px; opacity:.7}
.railfoot{margin-top:auto; padding-top:18px}
.portalmark{margin:-7px 9px 17px; font-family:var(--mono); font-size:9.5px; text-transform:uppercase;
  letter-spacing:.14em; color:var(--ink-3)}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; background:rgba(247,247,246,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:12px; padding:10px 26px}
.crumbs{display:block; font-size:13px; color:var(--ink-3); margin-bottom:14px}
.crumbs b{color:var(--ink-2); font-weight:600}
.crumbs a{text-decoration:none; color:var(--ink-3)} .crumbs a:hover{text-decoration:underline; color:var(--ink)}
.spacer{flex:1}
.persona{display:flex; align-items:center; gap:7px; background:var(--paper); border:1px solid var(--rule);
  border-radius:999px; padding:3px 6px 3px 12px; box-shadow:var(--shadow)}
.persona label{font-size:12px; color:var(--ink-3)}
.persona select{border:none; background:none; font:inherit; font-size:13.5px; padding:3px 2px; cursor:pointer}
.page{padding:26px; max-width:1240px; width:100%}
.pagehead{display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.pagehead p{margin:7px 0 0; color:var(--ink-2); max-width:66ch}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin-bottom:7px}
.eyebrow .sep{color:var(--ink-3); margin:0 2px}

.card{background:var(--paper); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.card.flat{box-shadow:none; background:var(--wash)}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.muted{color:var(--ink-3)} .small{font-size:13px}
hr.rule{border:none; border-top:1px solid var(--rule-2); margin:14px 0}

.btn{border:1px solid var(--ink); background:var(--ink); color:#fff; padding:9px 15px; border-radius:10px; cursor:pointer;
  font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:7px; text-decoration:none}
.btn:hover{background:#282826}
.btn.ghost{background:var(--paper); color:var(--ink); border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3); background:var(--wash)}
.btn.sm{padding:5px 11px; font-size:13px; border-radius:8px}
.btn.big{padding:12px 20px; font-size:15px}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.quiet{background:none; border-color:transparent; color:var(--ink-2); padding:5px 6px}
.btn.quiet:hover{color:var(--ink); text-decoration:underline; background:none}

.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 10px; border-radius:999px;
  border:1px solid var(--rule); background:var(--paper); color:var(--ink-2); white-space:nowrap}
.chip.solid{background:var(--ink); color:#fff; border-color:var(--ink)}
.chip.line{border-color:var(--ink); color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;border:1px solid rgba(0,0,0,.28)}
.stages{display:flex; align-items:center; gap:0; margin-bottom:18px}
.stage{display:flex; align-items:center; gap:8px; color:var(--ink-3)}
.stage .num{width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; border:1px solid var(--rule); background:var(--paper); color:var(--ink-3)}
.stage .lbl{font-size:13px; white-space:nowrap}
.stage.done{color:var(--ink-2)}
.stage.done .num{background:var(--ink); border-color:var(--ink); color:#fff; font-size:12px}
.stage.now{color:var(--ink)}
.stage.now .num{border-color:var(--ink); color:var(--ink); font-weight:600}
.stage.now .lbl{font-weight:600}
.stage-line{flex:1; min-width:16px; height:1px; background:var(--rule); margin:0 12px}

/* tappable filter pills */
.pills{display:flex; gap:7px; flex-wrap:wrap}
.pill{border:1px solid var(--rule); background:var(--paper); border-radius:999px; padding:6px 13px; font-size:13.5px;
  cursor:pointer; color:var(--ink-2)}
.pill:hover{border-color:var(--ink-3)}
.pill.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:500}
.pill .n{opacity:.65; margin-left:5px; font-size:12px}

.search{position:relative; flex:1; min-width:180px; max-width:340px}
.search input{padding-left:34px}
.search::before{content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:16px}
.filters{display:flex; gap:12px; flex-wrap:wrap; margin-top:12px}
.filters label{display:flex; flex-direction:column; gap:5px; flex:1; min-width:170px}
.filters label span{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-3)}
.uplo-unit{padding:13px 0; border-top:1px solid var(--rule-2)}
.uplo-unit:first-of-type{border-top:0; padding-top:2px}

input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{
  font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--rule); border-radius:10px;
  background:var(--paper); color:var(--ink); width:100%}
textarea{resize:vertical; min-height:92px; line-height:1.6}
label.fld{display:block; margin-bottom:13px}
label.fld > span{display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:5px; font-weight:500}
.hint{font-size:13px; color:var(--ink-3); margin-top:6px}

/* a row in a long list */
.lrow{display:flex; align-items:center; gap:13px; padding:13px 16px; border-bottom:1px solid var(--rule-2);
  text-decoration:none; cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--wash)}
.lrow .who{min-width:0; flex:1}
.lrow .who b{display:block; font-weight:600}
.lrow .who span{display:block; font-size:13px; color:var(--ink-3)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--wash);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.listhead{display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--rule);
  font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3)}
.groupbar{padding:9px 16px; background:var(--wash); border-bottom:1px solid var(--rule-2); font-size:12.5px;
  color:var(--ink-2); font-weight:600; position:sticky; top:53px; z-index:5}
.more{padding:13px; text-align:center; border-top:1px solid var(--rule-2)}

table{width:100%; border-collapse:collapse}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3);
  font-weight:500; padding:11px 15px; border-bottom:1px solid var(--rule)}
td{padding:12px 15px; border-bottom:1px solid var(--rule-2); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--wash)}

.stat{padding:16px 18px}
.stat .k{font-size:12.5px; color:var(--ink-3)}
.stat .v{font-family:var(--display); font-size:31px; font-weight:600; letter-spacing:-.045em; margin-top:2px}
.stat .d{font-size:13px; color:var(--ink-2)}
.meter{height:6px; background:var(--rule-2); border-radius:99px; overflow:hidden}
.meter > i{display:block; height:100%; background:var(--ink); border-radius:99px}
.score{font-family:var(--display); font-weight:800; font-size:24px; line-height:1; border:2px solid var(--ink);
  border-radius:50%/45%; padding:13px 16px; transform:rotate(-6deg); display:inline-block; text-align:center}
.score small{display:block; font-size:10.5px; font-weight:600; color:var(--ink-2)}

.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule); margin-bottom:18px; overflow:auto}
.tab{background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px; cursor:pointer;
  color:var(--ink-3); font-size:14px; white-space:nowrap}
.tab.on{color:var(--ink); border-bottom-color:var(--ink); font-weight:600}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--paper)}
.seg button{border:none; background:none; padding:8px 14px; cursor:pointer; font-size:13.5px; color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink); color:#fff; font-weight:500}

.veil{position:fixed; inset:0; background:rgba(11,11,11,.42); z-index:60; display:grid; place-items:center; padding:20px}
.modal{background:var(--paper); border-radius:16px; width:min(580px,100%); max-height:86vh; overflow:auto;
  border:1px solid var(--rule); box-shadow:0 34px 64px -32px rgba(0,0,0,.6)}
.modal header{padding:18px 22px; border-bottom:1px solid var(--rule-2); display:flex; align-items:center; gap:10px}
.modal .body{padding:20px 22px}
.modal footer{padding:15px 22px; border-top:1px solid var(--rule-2); display:flex; gap:9px; justify-content:flex-end;
  position:sticky; bottom:0; background:var(--paper); flex-wrap:wrap}
.toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{background:var(--ink); color:#fff; padding:11px 17px; border-radius:11px; font-size:14px; box-shadow:0 16px 30px -18px rgba(0,0,0,.8); animation:rise .2s ease}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}

.chatwrap{display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start}
.msg{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--rule-2)}
.msg:last-child{border-bottom:none}
.mwho{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600}
.mwho.u{background:var(--ink); color:#fff}
.mwho.a{background:var(--paper); color:var(--ink); border:1px solid var(--ink)}
.msg .txt{white-space:pre-wrap}
.cursor{display:inline-block; width:7px; height:14px; background:var(--ink); vertical-align:-2px; animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sources{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}

.qnav{display:flex; gap:6px; flex-wrap:wrap}
.qbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--rule); background:var(--paper); font-size:13px; cursor:pointer}
.qbtn.answered{background:var(--ink); color:#fff; border-color:var(--ink)}
.qbtn.on{outline:2px solid var(--ink); outline-offset:2px}
.opt{display:flex; gap:11px; align-items:flex-start; padding:12px 14px; border:1px solid var(--rule); border-radius:11px;
  margin-bottom:8px; cursor:pointer; background:var(--paper)}
.opt:hover{background:var(--wash)}
.opt.sel{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:11.5px;flex:none}
.opt.sel .key{background:var(--ink); color:#fff; border-color:var(--ink)}
.clock{font-family:var(--mono); font-size:17px}

.mapwrap{display:grid; grid-template-columns:1fr 306px; gap:14px; align-items:start}
.map{background:var(--paper); border:1px solid var(--rule); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.map svg{display:block; width:100%; height:auto}
.nd{cursor:pointer}
.nd circle{transition:r .15s ease, stroke-width .15s ease}
.nd text{font-family:var(--body); pointer-events:none}
.nd:hover circle.core{stroke-width:3}
.key3{display:flex; gap:14px; flex-wrap:wrap}
.key3 span{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2)}

.bars{display:flex; align-items:flex-end; gap:5px; height:88px}
.bars > div{flex:1; background:var(--ink); opacity:.82; border-radius:4px 4px 0 0; position:relative}
.bars > div span{position:absolute; bottom:-19px; left:0; right:0; text-align:center; font-size:9.5px; color:var(--ink-3)}
.spark{display:flex; align-items:flex-end; gap:3px; height:42px}
.spark i{flex:1; background:var(--ink); opacity:.8; border-radius:2px 2px 0 0}
.empty{padding:38px 24px; text-align:center; color:var(--ink-3); border:1px dashed var(--rule); border-radius:14px; background:var(--paper)}
.empty b{display:block; color:var(--ink); font-family:var(--display); font-size:17px; margin-bottom:6px}
.tick{display:inline-block; width:16px}
.todo{display:flex; gap:14px; align-items:center; padding:16px 18px}
.todo .big{font-family:var(--display); font-size:34px; font-weight:700; letter-spacing:-.05em; line-height:1}
.qrbox{display:inline-block; padding:14px; background:#fff; border:1px solid var(--rule); border-radius:12px}
.qrbox svg{display:block; width:100%; height:auto; max-width:230px}
.joincode{font-family:var(--mono); font-size:26px; letter-spacing:.16em; font-weight:500}
.linkbox{font-family:var(--mono); font-size:12.5px; background:var(--wash); border:1px solid var(--rule); border-radius:9px; padding:10px 12px; word-break:break-all}
.shot{width:78px;height:78px;object-fit:cover;border-radius:9px;border:1px solid var(--rule)}
@media print{ body > *:not(#printArea){display:none !important} #printArea{display:block !important} #printArea .pcard{border:none;box-shadow:none} }
#printArea{display:none}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:none; border-bottom:1px solid var(--rule)}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .chatwrap,.mapwrap{grid-template-columns:1fr}
  .page{padding:18px 14px} .topbar{padding:10px 14px}
  .groupbar{top:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* =====================================================================
   The simple layer: cards instead of rows, two-way switches instead of
   filters, one bar of navigation instead of a menu tree.
   ===================================================================== */

/* --- cards --- */
.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(266px,1fr))}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.tiles.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tile{background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:15px 16px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:7px; text-decoration:none; color:inherit;
  transition:border-color .12s ease, transform .12s ease}
a.tile:hover,.tile.click:hover{border-color:var(--ink-3); transform:translateY(-1px)}
.tile h3{font-size:16.5px; line-height:1.28}
.tile .sub{font-size:13px; color:var(--ink-3); line-height:1.45}
.tile .foot{display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:9px; flex-wrap:wrap}
.tile .num{font-family:var(--display); font-size:32px; font-weight:700; letter-spacing:-.05em; line-height:1}
.tile.todo-now{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink), var(--shadow)}
.tile .mark{font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:-.04em; line-height:1}
.tile .mark small{font-size:12px; font-weight:600; color:var(--ink-3); letter-spacing:0}

/* one big thing to do, at the top of a page */
.hero{display:flex; gap:18px; align-items:center; flex-wrap:wrap; background:var(--ink); color:#fff;
  border-radius:16px; padding:20px 22px; box-shadow:var(--shadow)}
.hero h2{color:#fff; font-size:22px}
.hero .sub{color:rgba(255,255,255,.72); font-size:13.5px; margin-top:4px}
.hero .btn{background:#fff; color:var(--ink); border-color:#fff}
.hero .btn:hover{background:#EDEDEA}
.hero .btn.ghost{background:transparent; color:#fff; border-color:rgba(255,255,255,.45)}

/* --- the two-way switch that replaces filters --- */
.switch{display:inline-flex; background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:4px;
  gap:4px; box-shadow:var(--shadow); margin-bottom:16px; max-width:100%; flex-wrap:wrap; vertical-align:top}
.switch button{border:none; background:none; border-radius:9px; padding:9px 18px; cursor:pointer;
  font-size:14px; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; gap:7px}
.switch button:hover{background:var(--wash)}
.switch button.on{background:var(--ink); color:#fff; font-weight:600}
.switch button.on:hover{background:var(--ink)}
.switch button .n{font-size:12.5px; opacity:.72; font-weight:400}
.switch.sm button{padding:8px 10px; font-size:13.5px}
.switch.inline{display:inline-flex; width:auto; margin-bottom:0}
.switch.inline button{flex:none}

/* a section of the page, in place of a tab */
.sect{margin:26px 0 0}
.sect > .head{display:flex; align-items:baseline; gap:10px; margin-bottom:11px; flex-wrap:wrap}
.sect > .head h2{font-size:18px}
.sect > .head .count{font-size:13px; color:var(--ink-3)}
.sect > .head .spacer{flex:1}

/* --- navigation: four places, one bar --- */
.navitem.big{padding:11px 12px; font-size:15px}
.only-m{display:none}
.tabbar{display:none}
@media (max-width:1000px){
  .rail{display:none}
  .only-m{display:flex}
  .tabbar{display:flex; gap:4px; position:fixed; left:0; right:0; bottom:0; z-index:55; background:var(--paper);
    border-top:1px solid var(--rule); padding:7px 8px calc(9px + env(safe-area-inset-bottom)); overflow-x:auto}
  .tabbar a{flex:1; text-align:center; text-decoration:none; color:var(--ink-3); font-size:12.5px;
    padding:9px 4px; border-radius:11px; white-space:nowrap; min-width:68px}
  .tabbar a.on{background:var(--ink); color:#fff; font-weight:600}
  .tabbar a .n{font-size:11px; opacity:.75}
  .page{padding-bottom:96px}
  .hero{padding:17px 18px}
  .pagehead h1{font-size:24px}
}

/* --- asking: a chat, not a workspace --- */
.thread{display:flex; flex-direction:column; gap:16px; padding:8px 2px 4px; min-height:34vh}
.bwrap{display:flex; flex-direction:column; gap:6px; max-width:min(680px,84%)}
.bwrap.me{align-self:flex-end; align-items:flex-end}
.bwrap.ai{align-self:flex-start}
.b{padding:12px 15px; border-radius:17px; white-space:pre-wrap; font-size:14.8px; line-height:1.58}

.sug::-webkit-scrollbar{display:none}
.sug button{white-space:nowrap; border:1px solid var(--rule); background:var(--paper); border-radius:999px;

.sug button:hover{border-color:var(--ink); color:var(--ink)}
.subjrow{display:flex; gap:7px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none}
.subjrow::-webkit-scrollbar{display:none}
.subjrow button{white-space:nowrap; border:1px solid var(--rule); background:var(--paper); border-radius:999px;

.subjrow button.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:500}

.dotrow{display:flex; gap:4px; flex-wrap:wrap}
.dotrow .dot{width:10px; height:10px}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--rule); margin-bottom:18px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.tab .n{font-size:12px; opacity:.65}
.tab.on{color:var(--ink); border-bottom-color:var(--ink); font-weight:600}

.pin.tick{color:var(--green); font-size:34px; text-shadow:0 1px 0 #fff}
.pin.cross{color:var(--red); font-size:30px; text-shadow:0 1px 0 #fff}
.pin.marks{color:var(--red); font-size:15px; background:rgba(255,255,255,.92); border:1.5px solid var(--red);

.fileview .filenote{text-align:center; padding:26px}
.fileview .filenote b{font-family:var(--display); display:block; margin-bottom:4px}

function studentsOfClass(classId) {

  const viaGroup = DB.members.filter(m => m.group === k.group).map(m => m.student);
  const direct = DB.extras.filter(e => e.class === classId).map(e => e.student);
  return [...new Set([...viaGroup, ...direct])];
}
function classesOfStudent(studentId) {
  const groups = DB.members.filter(m => m.student === studentId).map(m => m.group);
  const viaGroup = DB.classes.filter(k => groups.includes(k.group)).map(k => k.id);
  const direct = DB.extras.filter(e => e.student === studentId).map(e => e.class);
  return [...new Set([...viaGroup, ...direct])].map(classOf).filter(Boolean);
}

    "Basnet","Khadka","Sharma","Joshi","Bhandari","Neupane","Dahal","Chaudhary","Maharjan"];
  const r = rng(20260731);
  let n = 0;
  DB.groups.find(g => g.id === "g_open").size = 40;
  DB.groups.forEach(g => {

      else {
        id = "p" + (++n);

        DB.people.push({ id, role:"student", name, ability: .2 + r()*.75, joinedYet: r() > .06 });
      }
      DB.members.push({ group:g.id, student:id, since:"2026-06-01T04:00:00Z" });

  });
  /* a repeating student sitting in with this year's group */

  /* results for the marking queue: everyone who took assignment 1 and the quiz */

                                     { prompt:"Question 2", marks:t.marks - Math.round(t.marks/2), topic:null }])
      .map((q, i) => { const got = Math.round(q.marks * Math.max(0, Math.min(1, ok + (hash(student+q.id)-.5)*.5)));
        return { prompt:q.prompt, got, max:q.marks, topic:q.topic,
          note: got === q.marks ? "Correct." : got ? "Right idea, a step missing." : "Nothing usable written here." }; });
    const score = lines.reduce((a, l) => a + l.got, 0), outOf = lines.reduce((a, l) => a + l.max, 0);
    const att = { id:uid("a"), test, class:klass, student, state:"marked", started:"2026-06-20T05:00:00Z",

    DB.attempts.push(att);
    DB.results.push({ id:uid("r"), attempt:att.id, test, class:klass, subject:t.subject, student, counts:t.counts,
      score, outOf, at:"2026-06-20T05:50:00Z", checked: hash(student+test) > .82,
      summary: score/outOf > .75 ? "A strong paper; the method holds up."
        : score/outOf > .5 ? "You know the material. Precision is costing you marks."
        : "The ideas are there in outline. Write the law down before the working.",
      good:["Set the problem up correctly"], lost:["Units missing on the final line"], lines });
  };
  const takers = (klass, share) => studentsOfClass(klass).filter(s => hash(s + klass) < share);
  takers("k1", .92).forEach(s => mk("x_asg", "k1", s, .55 + hash(s)*.4));

  takers("k3", .78).forEach(s => mk("x_asg", "k3", s, .48 + hash(s)*.45));
  takers("k1", .6).forEach(s => mk("x_quiz", "k1", s, .6 + hash(s)*.35));
})();

function fileSizeLabel(bytes) {
  const value = Number(bytes) || 0;
  if (value < 1024) return value + " B";
  if (value < 1048576) return Math.max(1, Math.round(value / 1024)) + " KB";
  return (value / 1048576).toFixed(1) + " MB";
}
function liveDocumentKind(path) {
  const shelf = String(path || "").split("/")[1] || "Material";
  return shelf === "Question Bank" ? "Past papers" : shelf;
}
function normalizeTeacherWorkspace(payload) {
  const rawSubjects = Array.isArray(payload && payload.subjects && payload.subjects.subjects)
    ? payload.subjects.subjects : [];
  const subjects = rawSubjects.map((subject, index) => ({
    id:"live_" + String(subject.slug || index).replace(/[^a-zA-Z0-9_]/g, "_"),
    title:String(subject.name || "Untitled subject"), code:"", semester:null, blurb:"",
    owner:S.me.id, live:true, apiSlug:String(subject.slug || ""),
    folderPath:String(subject.folder_path || subject.name || "")
  }));
  const rawDocuments = Array.isArray(payload && payload.documents)
    ? payload.documents
    : Array.isArray(payload && payload.documents && payload.documents.documents)
      ? payload.documents.documents : [];
  const documents = rawDocuments.map(document => {
    const path = String(document.path || document.source_path || document.source_file || "");
    const status = String(document.status || "").toLowerCase();
    const subject = subjects.find(item => path === item.folderPath || path.startsWith(item.folderPath + "/"));
    return {
      id:String(document.document_id || uid("doc")), subject:subject ? subject.id : "",
      name:String(document.name || document.filename || path.split("/").pop() || "Untitled document"), path,
      kind:liveDocumentKind(path), size:fileSizeLabel(document.size || document.size_bytes),
      state:document.indexed || ["completed", "indexed", "ready"].includes(status) ? "ready"
        : ["failed", "error"].includes(status) ? "unreadable" : "preparing",
      found:Number(document.chunk_count || document.chunks_indexed) || 0, live:true
    };
  });
  return { subjects, documents };
}
async function loadTeacherPapers() {
  try {
    const response = await fetch("/api/teacher/exams", { headers:{ Accept:"application/json" } });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || "Could not load generated papers.");
    const grouped = {};
    (Array.isArray(payload.papers) ? payload.papers : []).forEach(paper => {
      const subject = S.teacherBackend.subjects.find(item => item.apiSlug === paper.subjectSlug);
      if (!subject) return;
      grouped[subject.id] = grouped[subject.id] || [];
      grouped[subject.id].push(paper);
    });
    S.teacherPapers = grouped;
    S.teacherPaperError = "";
  } catch (error) {
    S.teacherPaperError = error instanceof Error ? error.message : "Could not load generated papers.";
  }
}
async function loadTeacherWorkspace() {
  try {
    const response = await fetch("/api/teacher/workspace", { headers:{ Accept:"application/json" } });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "Could not load the teacher workspace.");
    const normalized = normalizeTeacherWorkspace(payload);
    S.teacherBackend = { state:"ready", error:"", collection:payload.collection || null,
      subjects:normalized.subjects, documents:normalized.documents, tree:payload.sourceTree || null };
    if (payload.teacher) {
      S.me.name = String(payload.teacher.handle || S.me.name);
      S.me.email = String(payload.teacher.email || "");
    }
    await loadTeacherPapers();
  } catch (error) {
    S.teacherBackend = { state:"error",
      error:error instanceof Error ? error.message : "Could not load the teacher workspace.",
      collection:null, subjects:[], documents:[], tree:null };
  }
  render();
}

async function pollTeacherJob(jobId, fileName, attempt) {
  try {
    const response = await fetch("/api/teacher/jobs/" + encodeURIComponent(jobId), { headers:{ Accept:"application/json" } });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || "Could not check indexing progress.");
    const job = payload.job || {};
    const state = String(job.status || job.state || job.job_status || "").toLowerCase();
    const succeeded = ["completed", "complete", "finished", "succeeded", "success", "done", "indexed", "ready"].includes(state) || Boolean(job.completed_at);
    const failed = ["failed", "error", "cancelled", "canceled"].includes(state) || Boolean(job.error);
    if (succeeded) { await loadTeacherWorkspace(); toast(fileName + " is indexed and ready"); return; }
    if (failed) { await loadTeacherWorkspace(); toast(fileName + " could not be indexed"); return; }
    if (attempt >= 39) { await loadTeacherWorkspace(); toast(fileName + " is still indexing in the background"); return; }
    setTimeout(() => pollTeacherJob(jobId, fileName, attempt + 1), 1500);
  } catch (error) {
    if (attempt >= 3) { await loadTeacherWorkspace(); toast(error instanceof Error ? error.message : "Could not check indexing progress."); return; }
    setTimeout(() => pollTeacherJob(jobId, fileName, attempt + 1), 1500);
  }
}

/* ---------------------------------------------------------------
   The only colours in the product: red, yellow, green, and grey
   for anything not started.
   --------------------------------------------------------------- */
const RED = "#C43D2E", YELLOW = "#E0A800", GREEN = "#2E7D4F", GREY = "#C8C8C5";
function knowColor(v) { if (v === null || v === undefined) return GREY;
  return v < .4 ? RED : v < .7 ? YELLOW : GREEN; }
function knowWord(v) { if (v === null || v === undefined) return "Not started";
  return v < .4 ? "Struggling" : v < .7 ? "Getting there" : "Solid"; }
function dot(v, title) { return `<span class="dot" title="${esc(title || knowWord(v))}" style="background:${knowColor(v)}"></span>`; }

const TOPIC_INDEX = {};
Object.entries(DB.syllabus).forEach(([sid, chs]) => chs.forEach(ch =>
  ch.topics.forEach(t => TOPIC_INDEX[t.id] = { ...t, subject:sid, chapter:ch.chapter })));
const topicById = id => TOPIC_INDEX[id];
const topicsOf = sid => (DB.syllabus[sid] || []).flatMap(ch => ch.topics.map(t => ({ ...t, chapter:ch.chapter })));

/* how well one student knows one topic, from tests or from what they ask */
function topicScore(studentId, topicId, source) {
  const ov = DB.mine[studentId] && DB.mine[studentId][topicId];
  if (ov) return source === "tests" ? ov.e : ov.c;
  const t = topicById(topicId); if (!t) return null;
  if (t.taught === false) return null;
  const h = hash(studentId + topicId + source);
  if (h < .13) return null;
  const ability = person(studentId).ability ?? .6;
  let v = ability - (t.hard - .5) * .6 + (h - .5) * .26 + (source === "chat" ? .07 : 0);
  return clamp(.03, .98, v);
}
/* how the whole class is doing on one topic */
function classTopicScore(classId, topicId, source) {
  const roster = studentsOfClass(classId);
  const vals = roster.map(s => topicScore(s, topicId, source)).filter(v => v !== null);
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function scorerFor(classId, source) {
  const k = classOf(classId);
  return S.me.role === "teacher" && k.group !== "g_own"
    ? (t => classTopicScore(classId, t.id, source))
    : (t => topicScore(S.me.id, t.id, source));
}
/* one number for a whole class or subject */
function overall(classId, source) {
  const f = scorerFor(classId, source);
  const vals = topicsOf(classOf(classId).subject).map(f).filter(v => v !== null);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

/* ---------------------------------------------------------------
   Topic map
   --------------------------------------------------------------- */
function wrap(text, max) { const words = text.split(" "), lines = [""];
  for (const w of words) { if ((lines[lines.length-1] + " " + w).trim().length <= max) lines[lines.length-1] = (lines[lines.length-1] + " " + w).trim();
    else lines.push(w); }
  return lines.slice(0, 2); }

function mapSVG(subjectId, score, title) {
  const chapters = DB.syllabus[subjectId] || [];
  const cx = 500, cy = 360, RX = 232, RY = 150;
  const nodes = [], edges = [], pos = {};
  const start = chapters.length === 2 ? 0 : -Math.PI/2;
  chapters.forEach((ch, i) => {
    const a = start + i * 2*Math.PI/chapters.length;
    const chx = cx + RX*Math.cos(a), chy = cy + RY*Math.sin(a);
    edges.push({ x1:cx, y1:cy, x2:chx, y2:chy, w:1.6, o:.3 });
    nodes.push({ kind:"chapter", label:ch.chapter, x:chx, y:chy });
    const n = ch.topics.length, spread = Math.PI * (n > 4 ? 1.1 : .95);
    ch.topics.forEach((t, j) => {
      const ta = n === 1 ? a : a - spread/2 + j * spread/(n-1);
      const R2 = 104 + (j % 2 ? 34 : 0);
      const x = chx + R2*Math.cos(ta), y = chy + R2*Math.sin(ta);
      pos[t.id] = { x, y };
      edges.push({ x1:chx, y1:chy, x2:x, y2:y, w:1, o:.2 });
      nodes.push({ kind:"topic", id:t.id, label:t.name, x, y, score:score(t) });
    });
  });
  topicsOf(subjectId).forEach(t => (t.after || []).forEach(p => {
    if (pos[p] && pos[t.id]) edges.push({ x1:pos[p].x, y1:pos[p].y, x2:pos[t.id].x, y2:pos[t.id].y, w:1.2, o:.4, dash:"4 4" }); }));

  const xs = nodes.map(n => n.x).concat(cx), ys = nodes.map(n => n.y).concat(cy);
  const vx = Math.min(...xs) - 82, vy = Math.min(...ys) - 56;
  const vw = Math.max(...xs) - Math.min(...xs) + 164, vh = Math.max(...ys) - Math.min(...ys) + 118;
  const line = e => `<line x1="${e.x1.toFixed(1)}" y1="${e.y1.toFixed(1)}" x2="${e.x2.toFixed(1)}" y2="${e.y2.toFixed(1)}"
    stroke="#0B0B0B" stroke-width="${e.w}" opacity="${e.o}" ${e.dash ? `stroke-dasharray="${e.dash}"` : ""}></line>`;
  const draw = n => {
    if (n.kind === "chapter") { const ls = wrap(n.label, 17);
      return `<g class="nd"><circle class="core" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="15" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="1.6"></circle>
        ${ls.map((l, i) => `<text x="${n.x.toFixed(1)}" y="${(n.y+32+i*13).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0B0B0B">${esc(l)}</text>`).join("")}</g>`; }
    const r = n.score === null ? 9 : 13, ls = wrap(n.label, 15), sel = S.map.pick === n.id;
    return `<g class="nd" data-topic="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}: ${knowWord(n.score)}">
      ${sel ? `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r+7}" fill="none" stroke="#0B0B0B" stroke-width="1.5"></circle>` : ""}
      <circle class="core" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${knowColor(n.score)}"
        stroke="${n.score === null ? "#B4B4B0" : "#0B0B0B"}" stroke-width="${n.score === null ? 1 : 1.4}"
        ${n.score === null ? 'stroke-dasharray="3 3"' : ""}></circle>
      ${ls.map((l, i) => `<text x="${n.x.toFixed(1)}" y="${(n.y+r+15+i*12).toFixed(1)}" text-anchor="middle" font-size="11.5" fill="#3A3A38">${esc(l)}</text>`).join("")}</g>`;
  };
  const tl = wrap(title, 15);
  return `<svg viewBox="${vx.toFixed(0)} ${vy.toFixed(0)} ${vw.toFixed(0)} ${vh.toFixed(0)}" xmlns="http://www.w3.org/2000/svg"
      role="img" aria-label="Topic map for ${esc(title)}">
    <g>${edges.map(line).join("")}</g>
    <g><circle cx="${cx}" cy="${cy}" r="34" fill="#0B0B0B"></circle>
      ${tl.map((l, i) => `<text x="${cx}" y="${cy - (tl.length-1)*7 + i*14 + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">${esc(l)}</text>`).join("")}</g>
    <g>${nodes.map(draw).join("")}</g></svg>`;
}

  const svg = document.querySelector(".map svg"); if (!svg) return;

    g.addEventListener("click", pick);
