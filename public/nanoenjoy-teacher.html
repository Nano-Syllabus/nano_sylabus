/* ---------------------------------------------------------------
   The shell: four places to be, and nothing else.

   Everything a person used to reach through a menu is now reached
   from inside one of the four — results live inside Exams, students
   live inside a Class, the topic map lives inside a Subject.
   --------------------------------------------------------------- */

/* Marks are held back until a teacher publishes them. Two states only:
   waiting, or out. This is how every college in the country works. */
DB.results.forEach(r => { if (r.published === undefined) r.published = r.counts ? !!r.checked : true; });
/* assignments in this part of the world come in on paper and get scanned */
DB.results.forEach(r => { const t = testOf(r.test);
  if (t && t.kind === "assignment" && r.sheet === undefined) r.sheet = { pages:2 }; });

S.ask = { chat:null, mode:"explain" };

/* Every choice on every page is one of two things. No dropdowns, no
   filter chips that stack — one switch, two sides, a count on each. */
function twoWay(key, opts, extra) {
  const cur = pick(key, opts);
  return `<div class="switch ${extra || ""}">${opts.map(([v, l, n]) =>
    `<button class="${cur === v ? "on" : ""}" onclick="S.filt['${key}']='${v}'; S.page={}; render()">${l}${
      n !== undefined ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>`;
}
function tabs(key, opts) {
  const cur = pick(key, opts);
  return `<div class="tabs">${opts.map(([v, l, n]) =>
    `<button class="tab ${cur === v ? "on" : ""}" onclick="S.filt['${key}']='${v}'; S.page={}; render()">${l}${
      n !== undefined ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>`;
}
function pick(key, opts) {
  const v = S.filt[key];
  return opts.some(o => o[0] === v) ? v : opts[0][0];
}

function teacherPapers() {
  const mine = classesOfTeacher(S.me.id).map(k => k.id);
  return DB.results.filter(r => mine.includes(r.class));
}
function pendingPapers() { return teacherPapers().filter(r => !r.published).length; }

function inTeachersPortal() { return S.portal === "teacher"; }
function coreHash(hash) {
  const h = hash || location.hash || "#/";
  if (h === "#/teachers") return "#/";
  return h.startsWith("#/teachers/") ? "#/" + h.slice("#/teachers/".length) : h;
}
function portalHref(h) {
  if (!inTeachersPortal()) return h;
  return h === "#/" ? "#/teachers" : "#/teachers/" + h.replace(/^#\//, "");
}
function portalizeHTML(html) {
  if (!inTeachersPortal()) return html || "";
  return String(html || "").replace(/href=(["'])#\/([^"']*)\1/g,
    (all, quote, path) => `href=${quote}${portalHref("#/" + path)}${quote}`);
}
function resetViewState() {
  S.page = {}; S.q = {}; S.filt = {}; S.map.pick = null; S.ask = { chat:null, mode:"explain" };
}
function activateTeachersPortal() {
  if (inTeachersPortal() && S.me.role === "teacher") return;
  S.portal = "teacher";
  S.me = DB.people.find(p => p.role === "teacher") || S.me;
  resetViewState();
}
function leaveTeachersPortal() {
  S.portal = "student";
  S.me = DB.people.find(p => p.role === "student") || S.me;
  resetViewState();
  return true;
}

function NAV() {
  if (inTeachersPortal()) return [
    { h:"#/", label:"Today" },
    { h:"#/subjects", label:"Subjects", also:["#/subject/"], n:0 },
    { h:"#/classes", label:"Classrooms", also:["#/class/","#/students","#/student/","#/results/"], n:pendingPapers() }
  ];
  const todo = studentExams().todo.length;
  return [
    { h:"#/", label:"Today" },
    { h:"#/classes", label:"Subjects", also:["#/class/","#/map"] },
    { h:"#/exams", label:"Exams", also:["#/tests/","#/results/","#/sit/"], n:todo },
    { h:"#/ask", label:"Ask", also:["#/tutor"] }
  ];
}
function navOn(i, h) {
  return h === i.h || (i.h !== "#/" && h.startsWith(i.h)) || (i.also || []).some(a => h.startsWith(a));
}

function shell(body, crumbs) {
  const h = coreHash();
  const items = NAV();
  const you = h.startsWith("#/settings");
  const people = inTeachersPortal()
    ? DB.people.filter(u => u.role === "teacher").slice(0, 1)
    : DB.people.filter(u => u.role === "student").slice(0, 1);
  const pageBody = portalizeHTML(body), pageCrumbs = portalizeHTML(crumbs);
  const portalSwitch = inTeachersPortal()
    ? `<a class="navitem" href="#/" onclick="return leaveTeachersPortal()">Student Portal</a>`
    : `<a class="navitem" href="#/teachers">Teachers Portal</a>`;
  const mobilePortalSwitch = inTeachersPortal()
    ? `<a href="#/" onclick="return leaveTeachersPortal()">Student Portal</a>`
    : `<a href="#/teachers">Teachers Portal</a>`;
  return `<div class="app"><nav class="rail">
    <div class="brand"><div class="glyph">n</div><b>NanoSyllabus</b></div>
    ${inTeachersPortal() ? `<div class="portalmark">Teachers Portal</div>` : ""}
    ${items.map(i => `<a class="navitem big ${navOn(i, h) ? "on" : ""}" href="${portalHref(i.h)}">${i.label}${
      i.n ? `<span class="n">${i.n}</span>` : ""}</a>`).join("")}
    <div class="railfoot"><hr class="rule">
    <a class="navitem ${you ? "on" : ""}" href="${portalHref("#/settings")}">Settings</a>
    ${portalSwitch}</div>
    </nav><div class="main">
      <div class="topbar">
        <span class="only-m" style="align-items:center; gap:8px">
          <span class="glyph" style="width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px">n</span></span>
        <span class="spacer"></span>
        <div class="persona"><label for="who">${inTeachersPortal() ? "Teacher" : "Viewing as"}</label>
          <select id="who">${people.map(u =>
            `<option value="${u.id}" ${u.id === S.me.id ? "selected" : ""}>${esc(u.name.split(" ")[0])}, ${u.role}</option>`).join("")}</select></div>
      </div><div class="page">${pageCrumbs ? `<nav class="crumbs">${pageCrumbs}</nav>` : ""}${pageBody}</div></div>
    <nav class="tabbar">
      ${items.map(i => `<a class="${navOn(i, h) ? "on" : ""}" href="${portalHref(i.h)}">${i.label}${
        i.n ? ` <span class="n">${i.n}</span>` : ""}</a>`).join("")}
      <a class="${you ? "on" : ""}" href="${portalHref("#/settings")}">You</a>
      ${mobilePortalSwitch}</nav>
    </div>`;
}

/* old links still work — they just land in the new place */
const ALIAS = { "#/tests":"#/exams", "#/marking":"#/exams", "#/tutor":"#/ask" };

const ROUTES = [
  [/^#\/$/,                () => pageToday()],
  [/^#\/classes$/,         () => pageClasses()],
  [/^#\/classrooms$/,      () => pageStudentClassrooms()],
  [/^#\/subjects$/,        () => pageSubjects()],
  [/^#\/class\/(\w+)$/,    m => pageClass(m[1])],
  [/^#\/class\/(\w+)\/exam\/(\w+)$/, m => classExam(m[1], m[2])],
  [/^#\/subject\/(\w+)$/,  m => pageSubject(m[1])],
  [/^#\/exams$/,           () => pageExams()],
  [/^#\/tests\/(\w+)$/,    m => routeTest(m[1])],
  [/^#\/sit\/(\w+)$/,      m => pageSit(m[1])],
  [/^#\/results\/(\w+)$/,  m => pageResult(m[1])],
  [/^#\/students$/,        () => pageStudents()],
  [/^#\/student\/(\w+)$/,  m => pageStudent(m[1])],
  [/^#\/map$/,             () => pageMap()],
  [/^#\/ask$/,             () => pageAsk(null)],
  [/^#\/ask\/(\w+)$/,      m => pageAsk(m[1])],
  [/^#\/tutor\/(\w+)$/,    m => pageAsk(m[1])],
  [/^#\/join\/([\w-]+)$/,  m => pageJoin(m[1])],
  [/^#\/settings$/,        () => pageSettings()]
];

function routeTest(tid) {
  if (S.me.role === "teacher") {
    const g = DB.givings.find(x => x.test === tid && classOf(x.class) && classOf(x.class).teachers.includes(S.me.id));
    if (g) { location.hash = `#/class/${g.class}/exam/${tid}`; return null; }
    // a paper with no class yet — send them to the class it belongs to, or back
    const k = classesOfTeacher(S.me.id).find(k => k.subject === testOf(tid).subject);
    if (k) { location.hash = `#/class/${k.id}/exam/${tid}`; return null; }
    return { html:`<div class="empty"><b>Give this exam to a classroom first</b>
      <div style="margin-top:14px"><a class="btn" href="#/classes">Your classrooms</a></div></div>`, crumbs:"Classrooms" };
  }
  return pageTest(tid);
}
function render() {
  const requested = location.hash || "#/";
  const teacherRoute = requested === "#/teachers" || requested.startsWith("#/teachers/");
  if (teacherRoute) activateTeachersPortal();
  else if (inTeachersPortal()) { location.hash = portalHref(requested); return; }
  let h = coreHash(requested);
  if (S.me.role === "teacher" && h === "#/exams") { location.hash = "#/classes"; return; }
  if (h === "#/results") { S.filt.ex = "done"; location.hash = "#/exams"; return; }
  if (ALIAS[h]) { location.hash = ALIAS[h]; return; }
  for (const [re, fn] of ROUTES) { const m = h.match(re);
    if (m) { const out = fn(m); if (!out) return;
      $("#root").innerHTML = shell(out.html, out.crumbs);
      bindShell(); if (out.after) out.after(); return; } }
  $("#root").innerHTML = shell(`<div class="empty"><b>That page has moved</b>
    <div style="margin-top:14px"><a class="btn" href="#/">Go home</a></div></div>`, "Not found");
  bindShell();
}
function bindShell() {
  const sel = $("#who");
  if (sel) sel.onchange = e => {
    const next = DB.people.find(p => p.id === e.target.value);
    if (!next || (inTeachersPortal() ? next.role !== "teacher" : next.role !== "student")) return;
    S.me = next;
    resetViewState();
    toast("Now viewing as " + S.me.name.split(" ")[0]);
    location.hash = portalHref("#/");
    render();
  };
}
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo(0, 0); });
document.addEventListener("DOMContentLoaded", () => { seedCatalogue(); render(); loadTeacherWorkspace(); });
</script>
<script>
/* ---------------------------------------------------------------
   Numbers a teacher actually asks for
   --------------------------------------------------------------- */
function resultsOfClass(cid) { return DB.results.filter(r => r.class === cid); }
function studentAvg(sid, cid) {
  const rs = DB.results.filter(r => r.student === sid && (!cid || r.class === cid) && r.counts);
  if (!rs.length) return null;
  return rs.reduce((a, r) => a + r.score / r.outOf, 0) / rs.length;
}
function classAvg(cid) {
  const rs = resultsOfClass(cid).filter(r => r.counts);
  if (!rs.length) return null;
  return rs.reduce((a, r) => a + r.score / r.outOf, 0) / rs.length;
}
function givingsOfClass(cid) { return DB.givings.filter(g => g.class === cid); }
function nextEvent(cid) {
  const n = Date.now();
  return givingsOfClass(cid).map(g => ({ ...g, t:testOf(g.test) }))
    .filter(g => g.closes && Date.parse(g.closes) > n)
    .sort((a, b) => Date.parse(a.closes) - Date.parse(b.closes))[0] || null;
}
function windowState(g) {
  const n = Date.now(), o = g.opens ? Date.parse(g.opens) : null, c = g.closes ? Date.parse(g.closes) : null;
  if (o && n < o) return { state:"before", label:"Opens " + fmtDate(g.opens) + ", " + fmtTime(g.opens) };
  if (c && n > c) return { state:"closed", label:"Closed " + fmtDate(g.closes) };
  if (c) { const d = Math.ceil((c - n) / 864e5); return { state:"open", label: d <= 1 ? "Closes today" : "Closes in " + d + " days" }; }
  return { state:"open", label:"Open" };
}
function windowChip(g) { const w = windowState(g);
  return `<span class="chip ${w.state === "open" ? "line" : ""}">${esc(w.label)}</span>`; }
function studentFlag(sid, cid) {
  if (person(sid).joinedYet === false) return "not joined";
  const a = studentAvg(sid, cid);
  if (a === null) return "nothing handed in";
  if (a < .45) return "Needs Attention";
  if (a > .8) return "doing well";
  return "";
}

/* ---------------------------------------------------------------
   Today
   --------------------------------------------------------------- */
/* ---------------------------------------------------------------
   Cards that get reused everywhere
   --------------------------------------------------------------- */
function studentTile(sid, cid) {
  const f = studentFlag(sid, cid), avg = studentAvg(sid, cid);
  const vals = cid ? topicsOf(classOf(cid).subject).map(t => topicScore(sid, t.id, "tests")).filter(v => v !== null) : [];
  const know = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  const needs = f === "Needs Attention" || f === "not joined";
  return `<a class="tile ${needs ? "todo-now" : ""}" href="#/student/${sid}">
    <div class="row" style="gap:11px; flex-wrap:nowrap">
      <div class="avatar">${esc(initials(person(sid).name))}</div>
      <div style="min-width:0"><h3 style="margin:0">${esc(person(sid).name)}</h3>
        <div class="sub">${f ? esc(f) : "on track"}</div></div></div>
    <div class="foot">${dot(know)}<span class="small muted">${knowWord(know)}</span>
      <span class="spacer"></span><b>${avg === null ? "—" : pct(avg)}</b></div></a>`;
}

function classTile(k) {
  const ne = nextEvent(k.id), ov = overall(k.id, "tests");
  const waiting = resultsOfClass(k.id).filter(r => !r.published).length;
  return `<a class="tile ${waiting ? "todo-now" : ""}" href="#/class/${k.id}">
    <div class="row"><span class="eyebrow" style="margin:0">${esc(className(k))}</span>
      <span class="spacer"></span>${dot(ov)}</div>
    <h3>${esc(classCode(k))}</h3>
    <div class="sub">${classSize(k)} students</div>
    <div class="foot">
      ${waiting ? `<span class="chip solid">${waiting} papers waiting</span>`
        : ne ? `<span class="chip">${esc(testOf(ne.test).title)} · ${esc(windowState(ne).label.toLowerCase())}</span>`
        : `<span class="chip">no exam set</span>`}</div></a>`;
}

/* ---------------------------------------------------------------
   Today — a teacher opens the app to find the one thing waiting
   --------------------------------------------------------------- */
function pageToday() {
  if (S.me.role === "student") return studentToday();
  const mine = classesOfTeacher(S.me.id).filter(k => k.term === S.term);
  const pend = pendingPapers();
  const open = mine.flatMap(k => givingsOfClass(k.id).map(g => ({ ...g, k })))
    .filter(g => windowState(g).state === "open");
  const behind = mine.flatMap(k => studentsOfClass(k.id).map(s => ({ s, k })))
    .filter(x => studentFlag(x.s, x.k.id) === "Needs Attention");

  const hero = pend
    ? `<div class="hero"><div style="min-width:0">
         <h2>${pend} papers are marked and waiting for you</h2>
         <div class="sub">Already marked. You look, you change what you disagree with, you publish.</div></div>
       <span class="spacer"></span>
       <a class="btn big" href="#/exams" onclick="S.filt.ex='results'">Check and publish</a></div>`
    : open.length
    ? `<div class="hero"><div style="min-width:0">
         <h2>${open.length} exam${open.length === 1 ? " is" : "s are"} running now</h2>
         <div class="sub">${esc(testOf(open[0].test).title)} · ${esc(groupOf(classOf(open[0].class).group).name)}</div></div>
       <span class="spacer"></span><a class="btn big" href="#/exams">See exams</a></div>`
    : `<div class="hero"><div style="min-width:0">
         <h2>Nothing is waiting for you</h2>
         <div class="sub">Every paper is published. A good moment to set the next exam.</div></div>
       <span class="spacer"></span><button class="btn big" onclick="newTest()">Set an exam</button></div>`;

  const html = `
    <div class="pagehead"><div><h1>Good morning, ${esc(S.me.name.split(" ")[0])}</h1>
      <p>${mine.length} classes, ${mine.reduce((n, k) => n + classSize(k), 0)} students.</p></div>
      <span class="spacer"></span><button class="btn" onclick="newTest()">Set an exam</button></div>
    ${hero}
    <div class="sect"><div class="head"><h2>Your classrooms</h2>
      <span class="count">${mine.length}</span><span class="spacer"></span>
      <a class="btn quiet" href="#/classes">See all</a></div>
      <div class="tiles">${mine.slice(0, 6).map(classTile).join("")}</div>
      ${!mine.length ? `<div class="empty"><b>No classrooms this term</b>Start one and hand out the code.</div>` : ""}</div>
    ${behind.length ? `<div class="sect"><div class="head"><h2>Needs Attention</h2>
      <span class="count">${behind.length} students</span><span class="spacer"></span>
      <a class="btn quiet" href="#/students">See all</a></div>
      <div class="tiles">${behind.slice(0, 4).map(x => studentTile(x.s, x.k.id)).join("")}</div></div>` : ""}`;
  return { html, crumbs:"<b>Today</b>" };
}

/* ---------------------------------------------------------------
   Classes — this term or the ones before it. Nothing else to choose.
   --------------------------------------------------------------- */
function pageClasses() {
  if (S.me.role === "student") return studentSubjects();
  const all = classesOfTeacher(S.me.id);
  const terms = [["now", "This term", all.filter(k => k.term === "t26").length],
                 ["past", "Earlier", all.filter(k => k.term !== "t26").length]];
  const which = pick("term", terms);
  S.term = which === "now" ? "t26" : "t25";
  let mine = all.filter(k => k.term === S.term);
  const many = mine.length > 8;
  const q = (S.q.cls || "").toLowerCase();
  if (q) mine = mine.filter(k => (classCode(k) + " " + className(k)).toLowerCase().includes(q));
  mine = mine.slice().sort((a, b) => classCode(a).localeCompare(classCode(b)));

  const html = `
    <div class="pagehead"><div><h1>Classrooms</h1></div>
      <span class="spacer"></span><button class="btn" onclick="newClass()">Create classroom</button></div>
    ${many ? `<div class="card pad" style="margin-bottom:14px">${searchBox("cls", "Search by classroom code or subject")}</div>` : ""}
    ${mine.length ? `<div class="tiles">${mine.map(classTile).join("")}</div>`
      : `<div class="empty"><b>No classrooms ${which === "now" ? "this term" : "earlier"}</b>Run one of your subjects for a batch of students.</div>`}`;
  return { html, crumbs:"<b>Classrooms</b>" };
}

function pageSubjects() {
  if (S.me.role === "student") return studentSubjects();
  const subs = subjectsOfTeacher();
  let list = subs;
  const q = (S.q.sub || "").toLowerCase();
  if (q) list = list.filter(s => (s.title + " " + (s.code || "")).toLowerCase().includes(q));
  const backend = S.teacherBackend;
  const collection = backend.collection || {};
  const status = backend.state === "loading"
    ? `<div class="card pad flat" style="margin-bottom:14px"><b>Loading your real teacher collection…</b></div>`
    : backend.state === "error"
      ? `<div class="empty" style="margin-bottom:14px"><b>Could not load the teacher collection</b>${esc(backend.error)}
          <div style="margin-top:12px"><button class="btn" onclick="S.teacherBackend.state='loading'; render(); loadTeacherWorkspace()">Try again</button></div></div>`
      : `<div class="card pad flat" style="margin-bottom:14px"><div class="row">
          <div><b>${esc(collection.collection || "Teacher collection")}</b>
            <div class="small muted">Real backend · ${Number(collection.indexed_files) || 0} indexed files · ${Number(collection.indexed_chunks) || 0} chunks</div></div>
          <span class="spacer"></span><span class="chip">${esc(collection.tier || "collection")}</span>
          <button class="btn ghost sm" onclick="openCollectionSettings()">Collection settings</button></div></div>`;
  return { crumbs:"<b>Subjects</b>", html:`
    <div class="pagehead"><div><h1>Subjects</h1></div>
      <span class="spacer"></span><button class="btn" onclick="createLiveSubjectModal()" ${backend.state === "ready" ? "" : "disabled"}>Create subject</button></div>
    ${status}
    ${subs.length > 8 ? `<div class="card pad" style="margin-bottom:14px">${searchBox("sub", "Search your subjects")}</div>` : ""}
    ${backend.state === "ready" && list.length ? `<div class="tiles">${list.map(subjectAdminTile).join("")}</div>`
      : backend.state !== "ready" ? ""
      : `<div class="empty"><b>No subjects yet</b>Add a subject — upload its syllabus and past papers,
          and the rest builds itself. Then run it as a classroom for your students.</div>`}` };
}

function subjectAdminTile(s) {
  const chs = chaptersOf(s.id), mats = materialOf(s.id), bank = bankOf(s.id);
  const ks = classesOfTeacher(S.me.id).filter(k => k.subject === s.id);
  const live = isLiveSubject(s.id);
  const syllabusFiles = syllabusFilesOf(s.id);
  const hasSyllabusFile = syllabusFiles.length > 0;
  const hasStudyMaterial = mats.length > 0;
  const gaps = live
    ? !hasSyllabusFile ? "no syllabus file yet" : !hasStudyMaterial ? "no study material yet" : !bank.length ? "no past papers yet" : ""
    : !chs.length ? "no syllabus yet" : !mats.length ? "no material yet" : !bank.length ? "no past papers yet" : "";
  return `<a class="tile ${gaps ? "todo-now" : ""}" href="#/subject/${s.id}">
    <div class="row">${s.code ? `<span class="chip">${esc(s.code)}</span>` : ""}
      <span class="spacer"></span><span class="small muted">${s.semester ? "sem " + s.semester : ""}</span></div>
    <h3>${esc(s.title)}</h3>
    <div class="sub">${esc(s.programme || "")}${s.university ? " · " + esc(s.university) : ""}</div>
    <div class="sub">${live ? syllabusFiles.length + mats.length + " files" : chs.length + " units · " + mats.length + " files"} · ${bank.length} paper set${bank.length === 1 ? "" : "s"}</div>
    <div class="foot">${gaps ? `<span class="chip solid">${gaps}</span>`
      : `<span class="chip">${ks.length} classroom${ks.length === 1 ? "" : "s"}</span>`}</div></a>`;
}

function newClass(sid) {
  const subs = subjectsOfTeacher();
  openModal("New classroom", `
    <label class="fld"><span>Which subject does it teach?</span><select id="nk_s">
      ${subs.map(s => `<option value="${s.id}" ${sid === s.id ? "selected" : ""}>${esc(s.title)}${s.code ? " · " + esc(s.code) : ""}</option>`).join("")}
      ${!subs.length ? `<option value="__new">I haven't added it yet</option>` : ""}</select>
      ${subs.length ? `<div class="hint">Not there? <a href="#" onclick="closeModal(); createLiveSubjectModal(); return false">Add the subject first</a></div>` : ""}</label>
    <label class="fld"><span>Which batch of students?</span><select id="nk_g" onchange="document.getElementById('nk_gw').style.display=this.value==='__new'?'block':'none'">
      ${DB.groups.filter(g => g.mode === "campus").map(g => `<option value="${g.id}">${esc(g.name)}${g.college ? " · " + esc(g.college) : ""}</option>`).join("")}
      <option value="g_open">Anyone, online</option>
      <option value="__new" selected>A new classroom of students</option></select></label>
    <div id="nk_gw">
      <label class="fld"><span>Classroom code</span>
        <input id="nk_gn" type="text" placeholder="SEC BEI 076" style="text-transform:uppercase; font-family:var(--mono); letter-spacing:.05em">
        </label>
    </div>
    `,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="createClass()">Create the classroom</button>`);
}
function createClass() {
  let sid = $("#nk_s").value;
  if (sid === "__new") { closeModal(); createLiveSubjectModal(); return; }
  let gid = $("#nk_g").value;
  if (gid === "__new") { gid = uid("g");
    const code = ($("#nk_gn").value.trim() || "NEW CLASS").toUpperCase();
    const batch = (code.match(/\b(\d{3,4})\b/) || [])[1] || "";
    DB.groups.push({ id:gid, name:code, college:"", programme:"—", batch, mode:"campus", size:0, term:S.term }); }
  const k = { id:uid("k"), subject:sid, group:gid, teachers:[S.me.id], term:S.term,
    when:$("#nk_w").value.trim() || "To be arranged" };
  DB.classes.push(k);
  closeModal(); toast("Classroom started — now invite the students"); location.hash = "#/class/" + k.id;
}


/* ---------------------------------------------------------------
   One class — no tabs. Sections, in the order a teacher asks for them.
   --------------------------------------------------------------- */
function pageClass(id) {
  const k = classOf(id);
  if (!k) return { html:`<div class="empty"><b>Classroom not found</b></div>`, crumbs:"Classrooms" };
  if (!k.teachers.includes(S.me.id)) return studentClass(k);
  const subj = subjectOf(k.subject), g = groupOf(k.group);
  const roster = studentsOfClass(id);
  const mats = DB.material.filter(m => m.subject === k.subject);
  const gvs = givingsOfClass(id);
  const waiting = resultsOfClass(id).filter(r => !r.published);

  const opts = [["students", "Students", roster.length], ["exams", "Exams", gvs.length],
                ["chapters", "Class performance"], ["material", "Material", mats.length], ["class", "Settings"]];
  const tab = pick("ktab", opts);

  const panes = {
    students: () => {
      const q = (S.q.roster || "").toLowerCase();
      const fs = S.filt.rosterStatus || "", sort = S.filt.rosterSort || "low";
      const flagOf = s => studentFlag(s, id);
      let list = roster.slice();
      if (q) list = list.filter(s => person(s).name.toLowerCase().includes(q));
      if (fs === "help") list = list.filter(s => { const f = flagOf(s); return f === "Needs Attention" || f === "not joined"; });
      else if (fs === "notjoined") list = list.filter(s => flagOf(s) === "not joined");
      else if (fs === "well") list = list.filter(s => flagOf(s) === "doing well");
      list = list.sort((a, b) =>
        sort === "name" ? person(a).name.localeCompare(person(b).name)
        : sort === "high" ? (studentAvg(b, id) ?? -1) - (studentAvg(a, id) ?? -1)
        : (studentAvg(a, id) ?? -1) - (studentAvg(b, id) ?? -1));
      const p = paged(list, "roster", 9);
      const sel = (key, cur, options) => `<select onchange="S.filt['${key}']=this.value; S.page={}; render()">
        ${options.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
      return `
        <div class="row" style="margin-bottom:14px; gap:8px; flex-wrap:wrap">
          <input class="search" type="search" placeholder="Find a student by name" value="${esc(S.q.roster||"")}"
            oninput="S.q.roster=this.value; S.page={}; render()" style="flex:1; min-width:180px">
          ${sel("rosterStatus", fs, [["", "Everyone"], ["help", "Need help"], ["notjoined", "Not joined"], ["well", "Doing well"]])}
          ${sel("rosterSort", sort, [["low", "Lowest avg first"], ["high", "Highest avg first"], ["name", "A–Z"]])}
          <button class="btn ghost sm" onclick="shareCode('class','${id}')">Invite</button>
          <button class="btn ghost sm" onclick="exportMarks('${id}')">Export marks</button>
        </div>
        ${p.slice.length ? `<div class="card" style="overflow:hidden">
          ${p.slice.map((s, i) => {
            const f = studentFlag(s, id), avg = studentAvg(s, id);
            const needs = f === "Needs Attention" || f === "not joined";
            return `<a href="#/student/${s}" style="display:flex; align-items:center; gap:12px; padding:11px 16px;
              text-decoration:none; color:inherit; border-top:${i ? "1px solid var(--rule)" : "none"};
              background:${needs ? "var(--wash)" : "var(--paper)"}">
              <div class="avatar" style="flex:none">${esc(initials(person(s).name))}</div>
              <div style="flex:1; min-width:0">
                <div style="font-weight:500; font-size:14px">${esc(person(s).name)}</div>
                <div class="small muted">${f || "on track"}</div>
              </div>
              <b style="font-size:14px; min-width:40px; text-align:right">${avg === null ? "—" : pct(avg)}</b>
            </a>`;
          }).join("")}
        </div>` : `<div class="empty"><b>Nobody here</b>Try clearing a filter or the search.</div>`}
        ${p.more > 0 ? `<div style="margin-top:12px"><button class="btn ghost" onclick="S.page['${p.key}']=(S.page['${p.key}']||9)+18; render()">Show ${Math.min(p.more, 18)} more</button></div>` : ""}`;
    },

    exams: () => `
      <div class="row" style="margin-bottom:14px"><button class="btn" onclick="newClassExam('${id}')">New exam</button>
        <button class="btn ghost" onclick="reuseExam('${id}')">Reuse one I wrote</button>
        <span class="spacer"></span>
        <span class="small muted">Everything for an exam — questions, dates, papers — lives on its own page.</span></div>
      ${gvs.length ? `<div class="tiles">${gvs.map(gv => {
        const t = testOf(gv.test);
        const done = DB.results.filter(r => r.test === t.id && r.class === id);
        const avg = done.length ? done.reduce((a, r) => a + r.score / r.outOf, 0) / done.length : null;
        const unpub = done.filter(r => !r.published).length;
        const qn = DB.questions.filter(q => q.test === t.id).length;
        const hand = done.filter(r => r.sheet).length;
        return `<a class="tile ${unpub ? "todo-now" : ""}" href="#/class/${id}/exam/${t.id}">
          <div class="row">${windowChip(gv)}<span class="spacer"></span>
            <span class="small muted">${t.marks} marks</span></div>
          <h3>${esc(t.title)}</h3>
          <div class="sub">${qn ? qn + " questions" : "no questions yet"} · ${done.length} of ${roster.length} handed in${
            avg === null ? "" : " · avg " + pct(avg)}${hand ? " · " + hand + " on paper" : ""}</div>
          <div class="foot">${!qn ? `<span class="chip solid">add questions</span>`
            : unpub ? `<span class="chip solid">${unpub} to publish</span>`
            : done.length ? `<span class="chip">published</span>` : `<span class="chip">waiting for hand-ins</span>`}</div></a>`;
      }).join("")}</div>` : `<div class="empty"><b>No exam for this classroom yet</b>Set one up — you add the questions and the date as you go.
        <div style="margin-top:14px"><button class="btn" onclick="newClassExam('${id}')">New exam</button></div></div>`}`,

    chapters: () => mapPanel(id),

    material: () => `
      <div class="row" style="margin-bottom:14px"><button class="btn" onclick="addMaterial('${k.subject}')">Add material</button>
        <span class="small muted">Shared by every classroom you teach ${esc(subj.title)} to — add it once.</span></div>
      ${mats.length ? `<div class="tiles">${mats.map(m => `<div class="tile click" onclick="openMaterial('${m.id}')">
        <div class="row"><span class="chip">${esc(m.kind)}</span><span class="spacer"></span>
          <span class="small muted">${esc(m.size)}</span></div>
        <h3>${esc(m.name)}</h3>
        <div class="foot">${m.state === "ready" ? `<span class="chip">ready</span>`
          : m.state === "preparing" ? `<span class="chip solid">getting ready…</span>`
          : `<span class="chip solid">couldn't read it</span>
             <button class="btn quiet sm" onclick="event.stopPropagation(); retryMaterial('${m.id}')">Try again</button>`}</div></div>`).join("")}</div>`
        : `<div class="empty"><b>Nothing added yet</b>Until there is material here, the tutor has nothing to answer from.</div>`}`,

    class: () => `<div class="tiles two">
      <div class="tile"><h3>Teachers</h3>
        ${k.teachers.map(t => `<div class="row" style="padding:4px 0"><div class="avatar">${esc(initials(person(t).name))}</div>
          <span>${esc(person(t).name)}</span><span class="spacer"></span>
          <span class="chip">${t === k.teachers[0] ? "leads it" : "helps out"}</span></div>`).join("")}
        <div class="foot"><button class="btn ghost sm" onclick="addTeacher('${id}')">Add another teacher</button></div></div>
      <div class="tile"><h3>Codes and notices</h3>
        <div class="sub">One code lets the whole group in. A note shows at the top of their subject.</div>
        <div class="foot"><button class="btn ghost sm" onclick="shareCode('class','${id}')">Code and QR</button>
          <button class="btn ghost sm" onclick="postNote('${id}')">${k.note ? "Edit the note" : "Post a note"}</button></div></div>
      <div class="tile"><h3>The classroom itself</h3>
        <div class="row" style="justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--rule-2)"><span class="muted small">Classroom</span><span class="small mono">${esc(classCode(k))}</span></div>
        ${g.college && g.mode === "campus" ? `<div class="row" style="justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--rule-2)"><span class="muted small">College</span><span class="small">${esc(g.college)}</span></div>` : ""}
        <div class="row" style="justify-content:space-between; padding:5px 0"><span class="muted small">Meets</span><span class="small">${esc(k.when)}</span></div></div>
    </div>`
  };

  const html = `
    <div class="pagehead">
      <div><div class="eyebrow"><a href="#/subject/${k.subject}" style="color:inherit; text-decoration:none; border-bottom:1px solid var(--rule)">${esc(subj.title)}</a>${
        k.when ? `<span class="sep">·</span>${esc(k.when)}` : ""}</div>
        <h1>${esc(classCode(k))}</h1>
        <p>${classSize(k)} students${classAvg(id) !== null ? ` · class average ${pct(classAvg(id))}` : ""}</p></div>
      <span class="spacer"></span>
      <div class="row"><button class="btn ghost" onclick="shareCode('class','${id}')">Invite</button>
        <button class="btn" onclick="newClassExam('${id}')">New exam</button></div>
    </div>
    ${noteBanner(id)}
    ${waiting.length ? `<div class="hero" style="margin-bottom:18px"><div style="min-width:0">
      <h2>${waiting.length} papers waiting to be published</h2>
      <div class="sub">Nobody in this classroom can see their marks until you publish.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="publishFor('${id}')">Publish all ${waiting.length}</button></div>` : ""}
    ${tabs("ktab", opts)}
    ${panes[tab]()}`;
  return { html, crumbs:`<a href="#/classes">Classrooms</a> / <b>${esc(classCode(k))}</b>`,
    after:() => { if (tab === "chapters") bindMap(); } };
}
/* publish every waiting paper in a class, or in one exam */
function publishFor(cid, tid) {
  const rs = DB.results.filter(r => r.class === cid && (!tid || r.test === tid) && !r.published);
  rs.forEach(r => { r.published = true; r.checked = true; });
  toast(`Published ${rs.length} result${rs.length === 1 ? "" : "s"} — students can see them now`);
  render();
}

/* ---------------------------------------------------------------
   Everyone I teach
   --------------------------------------------------------------- */
function pageStudents() {
  const mine = classesOfTeacher(S.me.id).filter(k => k.term === S.term);
  const map = {};
  mine.forEach(k => studentsOfClass(k.id).forEach(s => (map[s] = map[s] || []).push(k)));
  const rows = Object.entries(map).map(([sid, ks]) => ({ sid, ks,
    flag: ks.map(k => studentFlag(sid, k.id)).find(f => f === "Needs Attention" || f === "not joined") || "",
    well: ks.some(k => studentFlag(sid, k.id) === "doing well") }));

  const q = (S.q.dir || "").toLowerCase();
  const fc = S.filt.dirClass || "", fs = S.filt.dirStatus || "", sort = S.filt.dirSort || "low";

  let list = rows;
  if (q) list = list.filter(x => person(x.sid).name.toLowerCase().includes(q));
  if (fc) list = list.filter(x => x.ks.some(k => k.id === fc));
  if (fs === "help") list = list.filter(x => x.flag);
  else if (fs === "notjoined") list = list.filter(x => person(x.sid).joinedYet === false);
  else if (fs === "well") list = list.filter(x => x.well);

  list = list.slice().sort((a, b) =>
    sort === "name" ? person(a.sid).name.localeCompare(person(b.sid).name)
    : sort === "high" ? (studentAvg(b.sid) ?? -1) - (studentAvg(a.sid) ?? -1)
    : (studentAvg(a.sid) ?? -1) - (studentAvg(b.sid) ?? -1));
  const p = paged(list, "dir", 12);

  const sel = (key, cur, options) => `<select onchange="S.filt['${key}']=this.value; S.page={}; render()">
    ${options.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;

  const html = `
    <div class="pagehead"><div><h1>Students</h1></div></div>
    <div class="card pad" style="margin-bottom:14px">
      ${searchBox("dir", "Find anyone by name")}
      <div class="filters">
        <label><span>Classroom</span>${sel("dirClass", fc, [["", "All classrooms"], ...mine.map(k => [k.id, className(k) + " · " + classCode(k)])])}</label>
        <label><span>Status</span>${sel("dirStatus", fs, [["", "Everyone"], ["help", "Need help"], ["notjoined", "Not joined"], ["well", "Doing well"]])}</label>
        <label><span>Sort by</span>${sel("dirSort", sort, [["low", "Lowest average first"], ["high", "Highest average first"], ["name", "Name (A–Z)"]])}</label>
      </div>
    </div>
    <div class="tiles">${p.slice.map(x => studentTile(x.sid, x.ks[0].id)).join("")}</div>
    ${!p.slice.length ? `<div class="empty"><b>Nobody matches</b>Try clearing a filter or the search.</div>` : ""}
    ${moreBar(p)}`;
  return { html, crumbs:`<a href="#/classes">Classrooms</a> / <b>Students</b>` };
}

function pageStudent(sid) {
  const shared = classesOfTeacher(S.me.id).filter(k => studentsOfClass(k.id).includes(sid));
  if (!shared.length) return { html:`<div class="empty"><b>Not one of your students</b>
    You only see the work of students in your own classes.</div>`, crumbs:"Students" };
  const rs = DB.results.filter(r => r.student === sid && shared.some(k => k.id === r.class));
  const pickId = shared.some(k => k.id === S.filt.stsub) ? S.filt.stsub : shared[0].id;
  const k = classOf(pickId);
  const html = `
    <div class="pagehead">
      <div class="row" style="gap:14px"><div class="avatar" style="width:52px;height:52px;font-size:17px">${esc(initials(person(sid).name))}</div>
        <div><h1>${esc(person(sid).name)}</h1>
          <p>${shared.map(x => esc(subjectOf(x.subject).title)).join(" · ")}</p></div></div>
      <span class="spacer"></span>
      ${studentAvg(sid) !== null ? `<div class="score">${pct(studentAvg(sid))}<small>average</small></div>` : ""}
    </div>
    ${shared.length > 1 ? `<div class="subjrow">${shared.map(x =>
      `<button class="${pickId === x.id ? "on" : ""}" onclick="S.filt.stsub='${x.id}'; render()">${esc(subjectOf(x.subject).title)}</button>`).join("")}</div>` : ""}

    <div class="sect"><div class="head"><h2>Papers</h2><span class="count">${rs.length}</span></div>
      ${rs.length ? `<div class="tiles">${rs.map(r => `<a class="tile" href="#/results/${r.id}">
        <div class="row">${r.published ? `<span class="chip">published</span>` : `<span class="chip solid">not published</span>`}
          <span class="spacer"></span><span class="small muted">${fmtDate(r.at)}</span></div>
        <h3>${esc(testOf(r.test).title)}</h3>
        <div class="sub">${esc(subjectOf(r.subject).title)}</div>
        <div class="foot"><span class="mark">${r.score}<small>/${r.outOf}</small></span>
          <span class="spacer"></span>${bar(r.score / r.outOf)}</div></a>`).join("")}</div>`
        : `<div class="empty"><b>Nothing handed in yet</b></div>`}</div>

    <div class="sect"><div class="head"><h2>Chapter by chapter</h2>
      <span class="count">${esc(subjectOf(k.subject).title)}</span></div>
      <div class="card pad">${topicsOf(k.subject).map(t => { const v = topicScore(sid, t.id, "tests");
        return `<div class="row" style="padding:6px 0; border-bottom:1px solid var(--rule-2)">${dot(v)}
          <span class="small">${esc(t.name)}</span><span class="spacer"></span>
          <span class="small muted">${knowWord(v)}</span></div>`; }).join("")}</div></div>`;
  return { html, crumbs:`<a href="#/students">Students</a> / <b>${esc(person(sid).name)}</b>` };
}
</script>
<script>
/* ---------------------------------------------------------------
   Student side
   --------------------------------------------------------------- */
function myClasses() { return classesOfStudent(S.me.id); }
function myGivings() {
  const ids = myClasses().map(k => k.id);
  return DB.givings.filter(g => ids.includes(g.class));
}
function comingUp() {
  const n = Date.now();
  return myGivings().filter(g => !g.closes || Date.parse(g.closes) > n)
    .sort((a, b) => Date.parse(a.closes || 0) - Date.parse(b.closes || 0));
}
function weakestAcross(n) {
  const out = [];
  myClasses().forEach(k => topicsOf(k.subject).forEach(t => {
    const v = topicScore(S.me.id, t.id, "tests");
    if (v !== null) out.push({ ...t, class:k.id, subject:k.subject, score:v });
  }));
  return out.sort((a, b) => a.score - b.score).slice(0, n);
}

/* ---------------------------------------------------------------
   Student cards
   --------------------------------------------------------------- */
function topicTile(t, cid) {
  const v = topicScore(S.me.id, t.id, "tests");
  return `<div class="tile ${v !== null && v < .4 ? "todo-now" : ""}">
    <div class="row">${dot(v)}<span class="small muted">${knowWord(v)}</span>
      <span class="spacer"></span><span class="chip">${esc(t.chapter || "")}</span></div>
    <h3>${esc(t.name)}</h3>
    <div class="foot"><button class="btn sm" onclick="practise('${t.id}','${cid}')">Practise</button>
      <button class="btn ghost sm" onclick="askAbout('${t.id}','${cid}')">Ask a doubt</button></div></div>`;
}

function subjectTile(k) {
  const s = subjectOf(k.subject), g = groupOf(k.group);
  const ts = topicsOf(k.subject);
  const solid = ts.filter(t => (topicScore(S.me.id, t.id, "tests") ?? 0) >= .7).length;
  const ne = nextEvent(k.id);
  return `<a class="tile ${ne ? "todo-now" : ""}" href="#/subject/${k.subject}">
    <div class="row"><span class="chip">${g.mode === "personal" ? "Your own" : g.mode === "open" ? "Open course" : esc(g.name)}</span>
      <span class="spacer"></span>${dot(overall(k.id, "tests"))}</div>
    <h3>${esc(s.title)}</h3>
    <div class="sub">${k.teachers.length ? "Taught by " + esc(person(k.teachers[0]).name) : "Just for you"}</div>
    <div class="dotrow">${ts.slice(0, 16).map(t =>
      dot(topicScore(S.me.id, t.id, "tests"), t.name + ": " + knowWord(topicScore(S.me.id, t.id, "tests")))).join("")}</div>
    <div class="sub">${solid} of ${ts.length} chapters solid</div>
    <div class="foot">${ne ? `<span class="chip solid">${esc(testOf(ne.test).title)} · ${esc(windowState(ne).label.toLowerCase())}</span>`
      : `<span class="chip">no exam coming</span>`}</div></a>`;
}

/* ---------------------------------------------------------------
   Today — one thing to do, then what is worth an hour
   --------------------------------------------------------------- */
function studentToday() {
  const { todo, done } = studentExams();
  const notes = myClasses().filter(k => k.note);
  const weak = weakestAcross(3);
  const marks = done.filter(x => x.res && x.res.published);
  const avg = marks.length ? marks.reduce((a, x) => a + x.res.score / x.res.outOf, 0) / marks.length : null;
  const red = weakestAcross(99).filter(t => t.score < .4).length;
  const next = todo[0];

  const hero = next
    ? `<div class="hero"><div style="min-width:0">
        <h2>${esc(next.t.title)}</h2>
        <div class="sub">${esc(subjectOf(next.t.subject).title)} · ${esc(next.w.label)} · ${next.t.marks} marks</div></div>
      <span class="spacer"></span>
      ${next.un ? `<button class="btn big" onclick="resumeAttempt('${next.un.id}')">Carry on</button>`
        : next.w.state === "open" ? `<button class="btn big" onclick="beginTest('${next.t.id}')">Start</button>`
        : `<a class="btn big ghost" href="#/tests/${next.t.id}">See what it covers</a>`}</div>`
    : weak.length
    ? `<div class="hero"><div style="min-width:0">
        <h2>Nothing due. ${esc(weak[0].name)} is your weakest chapter.</h2>
        <div class="sub">${esc(subjectOf(weak[0].subject).title)} · you keep losing marks here</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="practise('${weak[0].id}','${weak[0].class}')">Practise it</button></div>`
    : `<div class="hero"><div style="min-width:0"><h2>All quiet</h2>
        <div class="sub">Join a subject with the code your teacher gave you.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="enterCode()">Join with a code</button>
      <button class="btn big ghost" onclick="browseCourses()">Browse courses</button></div>`;

  const html = `
    <div class="pagehead"><div><h1>Good morning, ${esc(S.me.name.split(" ")[0])}</h1>
      <p>${myClasses().length} subjects. ${todo.length ? todo.length + " exam" + (todo.length === 1 ? "" : "s") + " to sit." : "Nothing due right now."}</p></div>
      <span class="spacer"></span><button class="btn ghost" onclick="enterCode()">Join with a code</button></div>
    ${notes.map(k => `<div class="card pad" style="margin-bottom:14px; border-left:3px solid var(--ink)">
      <div class="row"><b>${esc(subjectOf(k.subject).title)}</b><span class="spacer"></span>
        <span class="small muted">from ${esc(person(k.note.by).name)}</span></div>
      <div style="margin-top:5px">${esc(k.note.text)}</div></div>`).join("")}
    ${hero}

    <div class="tiles two" style="margin-top:16px">
      <a class="tile" href="#/exams" onclick="S.filt.ex='done'">
        <div class="sub">Your average so far</div>
        <div class="num">${avg === null ? "—" : pct(avg)}</div>
        <div class="sub">over ${marks.length} published result${marks.length === 1 ? "" : "s"}</div></a>
      <a class="tile ${red ? "todo-now" : ""}" href="#/classes">
        <div class="sub">Chapters still red</div>
        <div class="num">${red}</div>
        <div class="sub">across all your subjects</div></a>
    </div>

    ${weak.length ? `<div class="sect"><div class="head"><h2>Worth an hour today</h2>

/* ---------------------------------------------------------------
   The topic map, shared by both sides
   --------------------------------------------------------------- */
function mapPanel(cid) {
  const k = classOf(cid), teacher = S.me.role === "teacher" && k.teachers.includes(S.me.id);
  const src = S.map.source, score = scorerFor(cid, src);
  const ts = topicsOf(k.subject);
  if (!ts.length) return `<div class="empty"><b>No topics on this subject yet</b>Add a chapter and the map draws itself.</div>`;
  const vals = ts.map(t => ({ t, v:score(t) }));
  const counts = { green:vals.filter(x => x.v !== null && x.v >= .7).length,
    yellow:vals.filter(x => x.v !== null && x.v >= .4 && x.v < .7).length,
    red:vals.filter(x => x.v !== null && x.v < .4).length,
    grey:vals.filter(x => x.v === null).length };
  const pick = S.map.pick ? ts.find(t => t.id === S.map.pick) : null;

  return `
    <div class="row" style="margin-bottom:14px">
      <div class="seg">
        <button class="${src==="tests"?"on":""}" onclick="S.map.source='tests'; render()">${teacher ? "From class tests" : "From your tests"}</button>
        <button class="${src==="chat"?"on":""}" onclick="S.map.source='chat'; render()">${teacher ? "From what they ask" : "From your questions"}</button>
      </div>
      <span class="small muted">${src === "tests"
        ? (teacher ? "How this classroom answered test questions on each topic." : "Built from how you answered test questions.")
        : (teacher ? "What this classroom keeps asking the tutor about." : "Built from what you ask the tutor.")}</span>
    </div>
    <div class="mapwrap">
      <div class="map">${mapSVG(k.subject, score, subjectOf(k.subject).title)}</div>
      <div style="display:flex; flex-direction:column; gap:14px">
        ${pick ? topicPanel(cid, pick, teacher) : `
          <div class="card pad"><h3>How to read it</h3><hr class="rule">${legend()}
            <div class="small muted" style="margin-top:12px">Dotted lines join topics that build on each other.
              Tap any topic for the detail.</div></div>
          <div class="card pad"><h3>${teacher ? "Where the classroom stands" : "Where you stand"}</h3><hr class="rule">
            ${[["Solid", counts.green, .9],["Getting there", counts.yellow, .55],["Struggling", counts.red, .2],["Not started", counts.grey, null]]
              .map(([l, n, v]) => `<div class="row" style="padding:7px 0; border-bottom:1px solid var(--rule-2)">
                ${dot(v)}<span class="small">${l}</span><span class="spacer"></span><b>${n}</b></div>`).join("")}
          </div>`}
      </div>
    </div>
    ${teacher ? "" : disagreement(cid)}`;
}

function topicPanel(cid, t, teacher) {
  const k = classOf(cid);
  const ex = teacher ? classTopicScore(cid, t.id, "tests") : topicScore(S.me.id, t.id, "tests");
  const ch = teacher ? classTopicScore(cid, t.id, "chat") : topicScore(S.me.id, t.id, "chat");
  const row = (label, v) => `<div style="padding:10px 0; border-bottom:1px solid var(--rule-2)">
    <div class="row">${dot(v)}<span class="small">${label}</span><span class="spacer"></span><b class="small">${knowWord(v)}</b></div></div>`;
  return `<div class="card pad">
    <div class="row"><span class="chip">${esc(t.chapter)}</span><span class="spacer"></span>
      <button class="btn quiet sm" onclick="S.map.pick=null; render()">Clear</button></div>
    <h3 style="margin:8px 0 2px">${esc(t.name)}</h3>
    <hr class="rule">
    ${row(teacher ? "From class tests" : "From your tests", ex)}
    ${row(teacher ? "From what they ask" : "From your questions", ch)}
    ${teacher ? whoIsWeak(cid, t.id) : `
      <div class="small muted" style="margin:12px 0">${verdict(ex, ch)}</div>
      <div class="row"><button class="btn sm" onclick="practise('${t.id}','${cid}')">Practise this</button>
        <button class="btn ghost sm" onclick="askAbout('${t.id}','${cid}')">Ask about it</button></div>`}
  </div>`;
}
function verdict(ex, ch) {
  if (ex === null && ch === null) return "You haven't been near this one. Worth twenty minutes before it turns up in a test.";
  if (ex === null) return "You've asked about this but never been tested on it. A short practice set would tell you where you stand.";
  if (ch === null && ex < .5) return "You keep losing marks here and you've never asked about it. Start with a question to the tutor.";
  if (ex < .4 && ch !== null && ch > .6) return "You follow the explanation, then lose it under exam conditions. That's practice, not understanding.";
  if (ex > .75) return "Solid. Leave it alone and spend the time on something red.";
  return "Coming along. One more round of questions should settle it.";
}
function whoIsWeak(cid, tid) {
  const roster = studentsOfClass(cid);
  const rows = roster.map(s => ({ s, v:topicScore(s, tid, "tests") }))
    .filter(x => x.v !== null).sort((a, b) => a.v - b.v);
  const red = rows.filter(x => x.v < .4);
  const p = paged(red.length ? red : rows, "weak" + tid, 6);
  return `<hr class="rule">
    <div class="small muted" style="margin-bottom:8px">${red.length
      ? red.length + " of " + rows.length + " are struggling with this"
      : "Nobody is struggling with this one"}</div>
    ${p.slice.map(x => `<a class="row" href="#/student/${x.s}" style="padding:6px 0; text-decoration:none">
      ${dot(x.v)}<span class="small">${esc(person(x.s).name)}</span><span class="spacer"></span>
      <span class="small muted">${knowWord(x.v)}</span></a>`).join("")}
    ${p.more > 0 ? `<button class="btn quiet sm" onclick="S.page['${p.key}']=(S.page['${p.key}']||6)+12; render()">Show ${Math.min(p.more,12)} more</button>` : ""}`;
}
function disagreement(cid) {
  const k = classOf(cid), ts = topicsOf(k.subject);
  const askedNotTested = ts.filter(t => topicScore(S.me.id, t.id, "chat") !== null && topicScore(S.me.id, t.id, "tests") === null);
  const weakNotAsked = ts.filter(t => { const e = topicScore(S.me.id, t.id, "tests");
    return e !== null && e < .5 && topicScore(S.me.id, t.id, "chat") === null; });
  const both = ts.filter(t => { const e = topicScore(S.me.id, t.id, "tests"), c = topicScore(S.me.id, t.id, "chat");
    return e !== null && e < .5 && c !== null && c < .6; });
  if (!askedNotTested.length && !weakNotAsked.length && !both.length) return "";
  const block = (title, list, note) => !list.length ? "" : `<div class="card pad"><h3>${title}</h3><hr class="rule">
    ${list.map(t => `<div class="row" style="padding:7px 0; border-bottom:1px solid var(--rule-2)">
      ${dot(topicScore(S.me.id, t.id, "tests"))}<span class="small">${esc(t.name)}</span><span class="spacer"></span>
      <button class="btn quiet sm" onclick="practise('${t.id}','${cid}')">Practise</button></div>`).join("")}
    <div class="small muted" style="margin-top:10px">${note}</div></div>`;
  return `<div style="margin-top:18px">
    <h2 style="margin-bottom:4px">Where the two maps disagree</h2>
    <p class="small muted" style="margin:0 0 14px">Usually the most useful thing on this page.</p>
    <div class="grid g3">
      ${block("Asked about, never tested", askedNotTested, "You've read about these. Nothing has checked whether it stuck.")}
      ${block("Losing marks, never asked", weakNotAsked, "These are costing you and you've never asked why.")}
      ${block("Weak on both counts", both, "Start here.")}
    </div></div>`;
}

function pageMap() {
  const list = myClasses();
  if (!S.map.class || !list.some(k => k.id === S.map.class)) S.map.class = list[0] && list[0].id;
  if (!S.map.class) return { html:`<div class="empty"><b>Join a subject first</b>Your map is drawn per subject.</div>`, crumbs:"Chapters" };
  const html = `
    <div class="pagehead"><div><h1>Chapter map</h1>
      </div></div>
    <div class="subjrow">${list.map(k => `<button class="${S.map.class === k.id ? "on" : ""}"
      onclick="S.map.class='${k.id}'; S.map.pick=null; render()">${esc(subjectOf(k.subject).title)}</button>`).join("")}</div>
    ${mapPanel(S.map.class)}`;
  return { html, crumbs:"<b>Chapter map</b>", after:bindMap };
}

/* ---------------------------------------------------------------
   Exams — and the marks, which live inside them.

   A student sees two piles: to do, and done. A done exam either shows
   the mark or says the result hasn't been published yet.
   A teacher sees two piles: the exams, and the results waiting to go out.
   --------------------------------------------------------------- */
function studentExams() {
  const rows = myGivings().map(g => ({ g, t:testOf(g.test), k:classOf(g.class) }))
    .concat(DB.tests.filter(t => t.owner === S.me.id).map(t => ({ g:null, t, k:myClasses().find(x => x.subject === t.subject) })));
  const todo = [], done = [];
  rows.forEach(r => {
    const res = DB.results.filter(x => x.test === r.t.id && x.student === S.me.id);
    const un = DB.attempts.find(a => a.test === r.t.id && a.student === S.me.id && a.state === "in progress");
    const w = r.g ? windowState(r.g) : { state:"open", label:"Whenever you like" };
    const item = { ...r, res:res[res.length - 1] || null, un, w };
    if (un || (!res.length && w.state !== "closed")) todo.push(item); else done.push(item);
  });
  todo.sort((a, b) => (a.un ? -1 : 0) - (b.un ? -1 : 0)
    || Date.parse((a.g && a.g.closes) || "2099") - Date.parse((b.g && b.g.closes) || "2099"));
  done.sort((a, b) => Date.parse((b.res && b.res.at) || 0) - Date.parse((a.res && a.res.at) || 0));
  return { todo, done };
}

function examCard(t, w, res, un) {
  const waiting = res && !res.published;
  const act = un || (!res && w.state === "open");
  return `<div class="tile ${act ? "todo-now" : ""}">
    <div class="row"><span class="chip">${esc(subjectOf(t.subject).title)}</span>
      <span class="spacer"></span>${t.counts ? `<span class="chip line">counts</span>` : `<span class="chip">practice</span>`}</div>
    <h3>${esc(t.title)}</h3>
    <div class="sub">${t.marks} marks${t.minutes ? " · " + t.minutes + " minutes" : ""}${
      un ? " · half done" : ""}</div>
    <div class="foot">
      ${un ? `<button class="btn sm" onclick="resumeAttempt('${un.id}')">Carry on</button>
              <span class="chip">${esc(w.label)}</span>`
      : res ? (waiting
          ? `<span class="chip solid">result not published yet</span>`
          : `<span class="mark">${res.score}<small>/${res.outOf}</small></span>
             <span class="spacer"></span><a class="btn ghost sm" href="#/results/${res.id}">See answers</a>`)
      : w.state === "open" ? `<button class="btn sm" onclick="beginTest('${t.id}')">Start</button>
             <span class="chip">${esc(w.label)}</span>`
      : w.state === "before" ? `<span class="chip">${esc(w.label)}</span>
             <a class="btn ghost sm" href="#/tests/${t.id}">What it covers</a>`
      : `<span class="chip">missed · closed</span>`}
    </div></div>`;
}
function examTileStudent(item) { return examCard(item.t, item.w, item.res, item.un); }

function teacherExamRows() {
  const mineClasses = classesOfTeacher(S.me.id).filter(k => k.term === S.term);
  const subjects = [...new Set(mineClasses.map(k => k.subject))];
  return DB.tests.filter(t => t.owner === S.me.id && subjects.includes(t.subject));
}
function teacherResultRows() {
  const out = [];
  classesOfTeacher(S.me.id).filter(k => k.term === S.term).forEach(k => {
    givingsOfClass(k.id).forEach(g => {
      const rs = DB.results.filter(r => r.test === g.test && r.class === k.id);
      if (!rs.length) return;
      out.push({ g, k, t:testOf(g.test), rs, waiting:rs.filter(r => !r.published).length });
    });
  });
  return out.sort((a, b) => b.waiting - a.waiting);
}

function pageExams() {
  return S.me.role === "teacher" ? teacherExamsPage() : studentExamsPage();
}

function studentExamsPage() {
  const { todo, done } = studentExams();
  const opts = [["todo", "To do", todo.length], ["done", "Done", done.length]];
  const side = pick("ex", opts);
  const list = side === "todo" ? todo : done;
  const waiting = done.filter(x => x.res && !x.res.published).length;

  const html = `
    <div class="pagehead"><div><h1>Exams</h1>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost" onclick="enterCode()">Join with a code</button>
      <button class="btn" onclick="practiseModal()">Practise</button></div>
    ${twoWay("ex", opts)}
    ${side === "done" && waiting ? `<div class="card pad" style="margin-bottom:14px">
      <b>${waiting} result${waiting === 1 ? " is" : "s are"} not published yet.</b>
      <div class="small muted" style="margin-top:4px">Your teacher checks the papers first. You will see the marks the moment they publish.</div></div>` : ""}
    ${list.length ? `<div class="tiles">${list.map(examTileStudent).join("")}</div>`
      : side === "todo" ? `<div class="empty"><b>Nothing to sit</b>Good time to practise a red chapter.
          <div class="row" style="margin-top:14px; justify-content:center">
            <button class="btn" onclick="practiseModal()">Practise something</button>
            <button class="btn ghost" onclick="browseCourses()">Browse courses</button></div></div>`
        : `<div class="empty"><b>No marks yet</b>Sit an exam and it lands here.</div>`}`;
  return { html, crumbs:"<b>Exams</b>" };
}

function teacherExamsPage() {
  const exams = teacherExamRows(), results = teacherResultRows();
  const waiting = pendingPapers();
  const opts = [["exams", "Exams", exams.length], ["results", "Results", waiting]];
  const side = pick("ex", opts);

  const examTiles = exams.map(t => {
    const gvs = DB.givings.filter(g => g.test === t.id);
    const handed = DB.results.filter(r => r.test === t.id).length;
    const qn = DB.questions.filter(q => q.test === t.id).length;
    const live = gvs.some(g => windowState(g).state === "open");
    return `<a class="tile ${!gvs.length || !qn ? "todo-now" : ""}" href="#/tests/${t.id}">
      <div class="row"><span class="chip">${esc(subjectOf(t.subject).title)}</span><span class="spacer"></span>
        <span class="small muted">${t.marks} marks</span></div>
      <h3>${esc(t.title)}</h3>
      <div class="sub">${qn} question${qn === 1 ? "" : "s"} · ${esc(t.kind)}</div>
      <div class="foot">${!qn ? `<span class="chip solid">no questions yet</span>`
        : !gvs.length ? `<span class="chip solid">unpublished</span><span class="spacer"></span>
            <button class="btn sm" onclick="event.preventDefault(); publishExam('${t.id}')">Publish →</button>`
        : live ? `<span class="chip line">running now</span><span class="small muted">${handed} handed in</span>`
        : `<span class="chip">finished · ${handed} handed in</span>`}</div></a>`;
  }).join("");

  const resultTiles = results.map(r => {
    const avg = r.rs.reduce((a, x) => a + x.score / x.outOf, 0) / r.rs.length;
    return `<div class="tile ${r.waiting ? "todo-now" : ""}">
      <div class="row"><span class="chip">${esc(groupOf(r.k.group).name)}</span><span class="spacer"></span>
        ${r.waiting ? `<span class="chip solid">not published</span>` : `<span class="chip">published</span>`}</div>
      <h3>${esc(r.t.title)}</h3>
      <div class="sub">${r.rs.length} of ${classSize(r.k)} handed in · average ${pct(avg)}</div>
      <div class="foot">
        ${r.waiting ? `<button class="btn sm" onclick="publishFor('${r.k.id}','${r.t.id}')">Publish all ${r.waiting}</button>` : ""}
        <a class="btn ghost sm" href="#/tests/${r.t.id}">See papers</a></div></div>`;
  }).join("");

  const html = `
    <div class="pagehead"><div><h1>Exams</h1>
      </div>
      <span class="spacer"></span><button class="btn" onclick="newTest()">Set an exam</button></div>
    ${twoWay("ex", opts)}
    ${side === "exams"
      ? (exams.length ? `<div class="tiles">${examTiles}</div>`
        : `<div class="empty"><b>No exams yet</b>Write one and give it to a class.
          <div style="margin-top:14px"><button class="btn" onclick="newTest()">Set an exam</button></div></div>`)
      : (results.length ? `${waiting ? `<div class="card pad" style="margin-bottom:14px">
            <b>${waiting} papers are marked and waiting.</b>
            <div class="small muted" style="margin-top:4px">Students see nothing until you publish. Open a paper to change any mark first.</div></div>` : ""}
          <div class="tiles">${resultTiles}</div>`
        : `<div class="empty"><b>Nothing handed in yet</b>Papers arrive here the moment your students hand them in.</div>`)}`;
  return { html, crumbs:"<b>Exams</b>" };
}

/* ---------------------------------------------------------------
   One exam
   --------------------------------------------------------------- */
function pageTest(id) {
  const t = testOf(id);
  if (!t) return { html:`<div class="empty"><b>Exam not found</b></div>`, crumbs:"Exams" };
  const qs = DB.questions.filter(q => q.test === id);
  const gvs = DB.givings.filter(g => g.test === id);
  if (S.me.role === "student") return studentTest(t, qs, gvs);

  const rs = DB.results.filter(r => r.test === id);
  const waiting = rs.filter(r => !r.published);
  const used = qs.reduce((n, q) => n + q.marks, 0);

  const questionsPane = `
    <div class="row" style="margin-bottom:14px">
      <button class="btn" onclick="draftQuestions('${id}')">Write questions for me</button>
      <button class="btn ghost" onclick="addQuestion('${id}')">Add one myself</button>
      <span class="spacer"></span>
      <span class="chip ${used === t.marks ? "line" : ""}">${used} of ${t.marks} marks used</span></div>
    ${t.drafting ? `<div class="card pad" style="margin-bottom:12px"><b>Writing questions from your material…</b>
      <div class="meter" style="margin-top:10px"><i style="width:45%"></i></div>
      <div class="small muted" style="margin-top:8px">You can leave this page.</div></div>` : ""}
    ${qs.length ? qs.map((q, i) => `<div class="card pad" style="margin-bottom:10px">
      <div class="row" style="margin-bottom:7px"><span class="chip">Question ${i + 1}</span>
        <span class="chip">${q.type === "choice" ? "Multiple choice" : q.type === "short" ? "Short answer" : "Long answer"}</span>
        <span class="chip line">${q.marks} ${q.marks === 1 ? "mark" : "marks"}</span>
        ${q.topic && topicById(q.topic) ? `<span class="chip">${esc(topicById(q.topic).name)}</span>` : ""}
        <span class="spacer"></span>
        <button class="btn ghost sm" onclick="regenQuestion('${q.id}')" ${q.busy ? "disabled" : ""}>${q.busy ? "Rewriting…" : "Rewrite"}</button>
        <button class="btn quiet sm" onclick="dropQuestion('${q.id}')">Remove</button></div>
      <div ${q.busy ? 'style="opacity:.4"' : ""}>${esc(q.prompt)}</div>
      ${q.options ? `<div class="small muted" style="margin-top:9px">${q.options.map((o, oi) =>
        `<div>${String.fromCharCode(97 + oi)}) ${esc(o)}${oi === q.key ? " <b>· correct</b>" : ""}</div>`).join("")}</div>` : ""}
      ${q.marking ? `<div style="margin-top:10px"><div class="small muted" style="margin-bottom:5px">Marks are given for</div>
        ${q.marking.map(m => `<span class="chip">${esc(m.what)} · ${m.marks}</span> `).join("")}</div>` : ""}
      <div class="row" style="margin-top:10px"><span class="small muted">Ask for it as</span>
        ${[["choice","Multiple choice"],["short","Short answer"],["long","Long answer"]].map(([v, l]) =>
          `<button class="btn quiet sm" ${q.type === v ? "disabled" : ""} onclick="retypeQuestion('${q.id}','${v}')">${l}</button>`).join("")}</div>
    </div>`).join("") : `<div class="empty"><b>No questions yet</b>Have them drafted from your material, or write your own.
      <div class="row" style="margin-top:14px; justify-content:center">
        <button class="btn" onclick="draftQuestions('${id}')">Write questions for me</button>
        <button class="btn ghost" onclick="addQuestion('${id}')">Add one myself</button></div></div>`}`;

  const submissionsPane = !gvs.length
    ? `<div class="empty"><b>Not published yet</b>Publish this exam to a classroom and submissions will appear here.</div>`
    : gvs.map(g => {
        const k = classOf(g.class); if (!k) return "";
        const grs = rs.filter(r => r.class === g.class);
        const gWaiting = grs.filter(r => !r.published);
        const w = windowState(g);
        return `<div class="card pad" style="margin-bottom:14px">
          <div class="row" style="margin-bottom:10px">
            <div><b>${esc(classCode(k))}</b> <span class="small muted">· ${esc(groupOf(k.group).name)}</span>
              <div style="margin-top:4px">${windowChip(g)} <span class="small muted" style="margin-left:6px">${
                w.state === "before" ? "Hasn't opened yet" : w.state === "open" ? "Students can sit it now" : "Closed"}</span></div></div>
            <span class="spacer"></span>
            <button class="btn ghost sm" onclick="giveToClass('${id}','${g.class}')">Change dates</button></div>
          ${grs.length ? `
            <div class="row" style="margin-bottom:10px">
              <span class="small muted">${grs.length} of ${classSize(k)} submitted</span>
              <span class="spacer"></span>
              ${gWaiting.length ? `<button class="btn sm" onclick="publishFor('${g.class}','${id}')">Publish all ${gWaiting.length}</button>` : ""}
              <button class="btn ghost sm" onclick="bulkAdjust('${id}','${g.class}')">Adjust a question</button>
            </div>
            <div class="tiles">${grs.map(r => `<a class="tile ${r.published ? "" : "todo-now"}" href="#/results/${r.id}">
              <div class="row"><div class="avatar">${esc(initials(person(r.student).name))}</div>
                <div style="min-width:0"><h3 style="margin:0">${esc(person(r.student).name)}</h3>
                  <div class="sub">${r.sheet ? "on paper" : "typed"}</div></div></div>
              <div class="foot"><span class="mark">${r.score}<small>/${r.outOf}</small></span><span class="spacer"></span>

          : `<div class="small muted">No submissions yet.</div>`}

  const opts = [["q", "Questions", qs.length], ["submissions", "Submissions", rs.length]];

  const html = `
    <div class="pagehead">
      <div><div class="row" style="margin-bottom:8px">
          <span class="chip">${esc(subjectOf(t.subject).title)}</span>
          <span class="chip">${esc(t.kind)}</span>
          ${gvs.length ? `<span class="chip line">published to ${gvs.length} classroom${gvs.length === 1 ? "" : "s"}</span>`
            : `<span class="chip solid">unpublished</span>`}</div>
        <h1>${esc(t.title)}</h1>
        <p>${t.minutes ? t.minutes + " minutes" : "no time limit"} · ${t.marks} marks</p></div>
      <span class="spacer"></span>
      <div class="row">
        ${qs.length ? `<button class="btn ghost" onclick="printPaper('${id}')">Print</button>` : ""}
        <button class="btn ghost" onclick="duplicateTest('${id}')">Make a copy</button>
        <button class="btn" onclick="publishExam('${id}')">Publish to a classroom</button></div>
    </div>
    ${qs.length && !gvs.length ? `<div class="hero" style="margin-bottom:18px"><div style="min-width:0">
      <h2>Questions ready — publish when you are</h2>
      <div class="sub">Pick a classroom and set the dates. Students see it the moment it opens.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="publishExam('${id}')">Publish to a classroom →</button></div>` : ""}
    ${waiting.length ? `<div class="hero" style="margin-bottom:18px"><div style="min-width:0">
      <h2>${waiting.length} paper${waiting.length === 1 ? "" : "s"} ready to publish</h2>
      <div class="sub">Students can't see their marks until you publish.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="publishAllOf('${id}')">Publish all ${waiting.length}</button></div>` : ""}
    ${tabs("tt", opts)}
    ${side === "q" ? questionsPane : submissionsPane}`;
  return { html, crumbs:`<a href="#/exams">Exams</a> / <b>${esc(t.title)}</b>` };
}
function publishAllOf(tid) {
  const rs = DB.results.filter(r => r.test === tid && !r.published);
  rs.forEach(r => { r.published = true; r.checked = true; });
  toast(`Published ${rs.length} result${rs.length === 1 ? "" : "s"}`); render();
}

/* the last step of the exam flow: choose which batch sits it, then land on it */
function publishExam(tid) {
  const t = testOf(tid);
  const qs = DB.questions.filter(q => q.test === tid);
  if (!qs.length && !t.drafting) { toast("Add some questions first"); return; }
  const ks = classesOfTeacher(S.me.id).filter(k => k.subject === t.subject && k.term === S.term);
  if (!ks.length) { toast("Start a classroom for this subject first"); newClass(t.subject); return; }
  openModal("Publish this exam", `
    <div class="small muted" style="margin-bottom:12px">Choose which batch sits it. Each classroom keeps its own marks —
      you can publish the same exam to another batch later.</div>
    <label class="fld"><span>Which classroom?</span><select id="pb_c">
      ${ks.map(k => { const given = DB.givings.some(g => g.test === tid && g.class === k.id);
        return `<option value="${k.id}">${esc(classCode(k))} · ${classSize(k)} students${given ? " · already has it" : ""}</option>`; }).join("")}</select></label>
    <div class="grid g2">
      <label class="fld"><span>Opens on</span><input id="pb_od" type="date"></label>
      <label class="fld"><span>at</span><input id="pb_ot" type="text" placeholder="10:00"></label></div>
    <div class="grid g2">
      <label class="fld"><span>Closes on</span><input id="pb_cd" type="date"></label>
      <label class="fld"><span>at</span><input id="pb_ct" type="text" placeholder="11:30"></label></div>
    <div class="card pad flat"><div class="small">Leave the dates blank and they can sit it whenever they like.</div></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="doPublishExam('${tid}')">Publish to this classroom</button>`);
}
function doPublishExam(tid) {
  const cid = $("#pb_c").value; if (!cid) { toast("Pick a classroom"); return; }
  const mk = (dd, tt) => dd ? new Date(dd + "T" + (tt || "00:00") + ":00Z").toISOString() : null;
  const opens = mk($("#pb_od").value, $("#pb_ot").value), closes = mk($("#pb_cd").value, $("#pb_ct").value);
  let g = DB.givings.find(x => x.test === tid && x.class === cid);
  if (g) { g.opens = opens; g.closes = closes; } else { DB.givings.push({ id:uid("gv"), test:tid, class:cid, opens, closes }); }
  closeModal(); toast(classCode(classOf(cid)) + " can sit it now");
  S.filt.cx = "when"; location.hash = `#/class/${cid}/exam/${tid}`;
}

function studentTest(t, qs, gvs) {
  const mineClasses = myClasses().map(k => k.id);
  const g = gvs.find(x => mineClasses.includes(x.class));
  const w = g ? windowState(g) : { state:"open", label:"Whenever you like" };
  const done = DB.results.filter(r => r.test === t.id && r.student === S.me.id);
  const un = DB.attempts.find(a => a.test === t.id && a.student === S.me.id && a.state === "in progress");
  const noneLeft = t.tries !== null && done.length >= t.tries;
  const last = done[done.length - 1];
  const html = `
    <div class="pagehead">
      <div><div class="row" style="margin-bottom:8px"><span class="chip">${esc(subjectOf(t.subject).title)}</span>
        ${t.counts ? `<span class="chip line">counts towards your record</span>` : `<span class="chip">practice only</span>`}</div>
        <h1>${esc(t.title)}</h1>
        <p>${qs.length} questions · ${t.marks} marks · ${t.minutes ? t.minutes + " minutes once you start" : "no time limit"}</p></div>
      <span class="spacer"></span>
      <div class="row">
        ${un ? `<button class="btn big" onclick="resumeAttempt('${un.id}')">Carry on</button>`
        : noneLeft ? `<span class="chip">no attempts left</span>`
        : w.state === "open" ? `<button class="btn big" onclick="beginTest('${t.id}')">Start</button>`
        : `<span class="chip">${esc(w.label)}</span>`}</div>
    </div>
    ${last ? `<div class="card pad" style="margin-bottom:14px"><div class="row">
      ${last.published ? `<div><div class="small muted">Your mark</div><div class="mark" style="font-size:30px">${last.score}<small>/${last.outOf}</small></div></div>
        <span class="spacer"></span><a class="btn" href="#/results/${last.id}">See the answers</a>`
      : `<div><b>You have sat this one.</b><div class="small muted">The result is not published yet — your teacher is checking the papers.</div></div>`}</div></div>` : ""}
    ${readinessCard(t)}`;
  return { html, crumbs:`<a href="#/exams">Exams</a> / <b>${esc(t.title)}</b>` };
}

function readinessCard(t) {
  const ids = [...new Set(DB.questions.filter(q => q.test === t.id).map(q => q.topic).filter(Boolean))];
  if (!ids.length) return "";
  const k = myClasses().find(x => x.subject === t.subject);
  const rows = ids.map(id => ({ t:topicById(id), v:topicScore(S.me.id, id, "tests") })).filter(x => x.t);
  const weak = rows.filter(x => x.v === null || x.v < .7);
  return `<div class="sect"><div class="head"><h2>What it covers</h2>
      <span class="count">${weak.length ? weak.length + " not solid yet" : "you are solid on all of it"}</span></div>
    <div class="tiles">${rows.map(x => `<div class="tile ${x.v !== null && x.v < .4 ? "todo-now" : ""}">
      <div class="row">${dot(x.v)}<span class="small muted">${knowWord(x.v)}</span></div>
      <h3>${esc(x.t.name)}</h3>
      <div class="foot"><button class="btn sm" onclick="practise('${x.t.id}','${k ? k.id : ""}')">Practise</button>
        <button class="btn ghost sm" onclick="askAbout('${x.t.id}','${k ? k.id : ""}')">Ask a doubt</button></div></div>`).join("")}</div></div>`;
}

/* ---------------------------------------------------------------
   Sitting an exam

/* deterministic stat so numbers stay put across re-renders */
function seedNum(str, min, max) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return min + h % (max - min + 1); }
function stars(r) { const f = Math.round(r); return "★★★★★".slice(0, f) + "☆☆☆☆☆".slice(0, 5 - f); }

/* open a material and preview it by type */
function materialType(m) {
  const ext = (((m.file || m.name).match(/\.([a-z0-9]+)$/i) || [])[1] || "").toLowerCase();
  if (["png","jpg","jpeg","gif","webp","heic","bmp"].includes(ext)) return "image";
  if (ext === "pdf") return "pdf";
  if (["txt","md","csv"].includes(ext)) return "text";
  if (["ppt","pptx","key"].includes(ext)) return "slides";
  if (["doc","docx","rtf","odt"].includes(ext)) return "doc";
  const k = (m.kind || "").toLowerCase(), n = (m.name || "").toLowerCase();
  if (/photo|image|scan|board|snap/.test(n) || /photo|image/.test(k)) return "image";
  if (/slide/.test(k)) return "slides";
  if (/paper/.test(k)) return "pdf";
  return "doc";
}
function boardSVG(m, subj) {
  const chs = chaptersOf(m.subject), c = chs[0];
  const title = c ? c.chapter : (subj ? subj.title : "Notes");
  const lines = (c ? c.topics.map(t => t.name) : []).slice(0, 3);
  const chalk = lines.map((l, i) => `<text x="54" y="${150 + i * 46}" fill="#EAF3EC" font-family="var(--display)" font-size="26" opacity="${.92 - i * .12}">${esc(l)}</text>`).join("");
  return `<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
    <rect width="640" height="420" rx="10" fill="#6b4f34"/>
    <rect x="14" y="14" width="612" height="392" rx="6" fill="#1f3d2f"/>
    <text x="54" y="90" fill="#fff" font-family="var(--display)" font-size="34" font-weight="600">${esc(title)}</text>
    <line x1="54" y1="104" x2="360" y2="104" stroke="#EAF3EC" stroke-width="2" opacity=".55"/>
    ${chalk}
    <text x="586" y="392" text-anchor="end" fill="#EAF3EC" font-family="var(--mono)" font-size="13" opacity=".5">${esc(m.name)}</text>
  </svg>`;
}
function openMaterial(mid) {
  const m = DB.material.find(x => x.id === mid); if (!m) return;
  const type = materialType(m), subj = subjectOf(m.subject), chs = chaptersOf(m.subject);
  const label = { image:"Image", pdf:"PDF", text:"Text file", doc:"Document", slides:"Slides" }[type];
  let inner;
  if (m.state === "unreadable") {
    inner = `<div class="fileview"><div class="filenote"><b>This file couldn't be read</b>
      <div class="small muted">It may be damaged, or in a format we don't recognise.</div>

  } else if (type === "image") {

  } else if (type === "slides") {
    const src = chs.length ? chs : [{ chapter:(subj ? subj.title : m.name), topics:[] }];
    inner = `<div class="fileview slides">${src.slice(0, 6).map((c, i) =>
      `<div class="slide"><span class="mono small muted">${String(i + 1).padStart(2, "0")}</span>

  } else {
    const bodyDoc = chs.length
      ? chs.map((c, i) => `<h4>${i + 1}. ${esc(c.chapter)}</h4>
          <p>${c.topics.map(t => esc(t.name)).join(", ") || "Notes for this unit"}. Worked examples and exam-style questions for ${esc(subj ? subj.title : "this subject")}.</p>`).join("")
      : `<p>Notes for ${esc(subj ? subj.title : "this subject")}.</p>`;
    inner = `<div class="fileview"><div class="page ${type === "text" ? "mono" : ""}">
      <h3>${esc(m.name.replace(/\.[a-z0-9]+$/i, ""))}</h3>

      ${bodyDoc}</div></div>`;
  }
  const status = m.state === "preparing"
    ? `<span class="chip solid">still reading it…</span>` : `<span class="chip">${esc(label)}</span>`;
  const body = `<div class="row" style="gap:8px; margin-bottom:12px">${status}
      <span class="chip">${esc(m.kind)}</span><span class="spacer"></span>
      <span class="small muted mono">${esc(m.size)}</span></div>${inner}`;
  openModal(esc(m.name), body, `<button class="btn" onclick="closeModal()">Close</button>`, "big");
}

    <div style="margin-top:14px"><button class="btn" onclick="newClass('${t.subject}')">Start a classroom</button></div></div>`;

  return `
    ${missing.length > 1 ? `<div class="row" style="margin-bottom:14px">
      <button class="btn ghost" onclick="giveEveryone('${tid}')">Give it to all ${missing.length} at once</button>
      <span class="small muted">Same paper, same dates. You can shift one group afterwards without touching the others.</span></div>` : ""}
    <div class="tiles">${ks.map(k => {
      const g = DB.givings.find(x => x.test === tid && x.class === k.id);
      const rs = DB.results.filter(r => r.test === tid && r.class === k.id);
