function practiseModal(cid, topicId) {
  const ks = myClasses();
  if (!ks.length) { browseCourses(); return; }
  const k = classOf(cid) || classOf(S.prac && S.prac.class) || ks[0];
  const ts = topicsOf(k.subject);
  if (!S.prac || S.prac.class !== k.id) {
    const weakest = ts.map(t => ({ id:t.id, v:topicScore(S.me.id, t.id, "tests") }))
      .sort((a, b) => (a.v === null ? .5 : a.v) - (b.v === null ? .5 : b.v)).slice(0, 3).map(x => x.id);
    S.prac = { class:k.id, topics:topicId ? [topicId] : weakest, len:5, style:"mixed" };
  }
  if (topicId && !S.prac.topics.includes(topicId)) S.prac.topics = [topicId];
  const p = S.prac;

  openModal("Practise", `
    ${ks.length > 1 ? `<div class="subjrow" style="margin-bottom:14px">${ks.map(x =>
      `<button class="${x.id === k.id ? "on" : ""}" onclick="S.prac=null; practiseModal('${x.id}')">${esc(subjectOf(x.subject).title)}</button>`).join("")}</div>` : ""}

    <div class="small muted" style="margin-bottom:8px">Which chapters? Your weakest are already ticked.</div>
    <div class="row" style="margin-bottom:16px">${ts.map(t => {
      const on = p.topics.includes(t.id);
      return `<button class="chip ${on ? "solid" : ""}" style="cursor:pointer; border-color:${on ? "var(--ink)" : "var(--rule)"}"
        onclick="pracTopic('${t.id}')">${on ? "✓ " : ""}${esc(t.name)}</button>`; }).join("")
      || `<span class="small muted">This subject has no chapters yet — the whole syllabus will be used.</span>`}</div>

    <div class="small muted" style="margin-bottom:6px">How long?</div>
    <div class="switch" style="margin-bottom:16px">
      <button class="${p.len === 5 ? "on" : ""}" onclick="S.prac.len=5; practiseModal('${k.id}')">Quick · 5 questions</button>
      <button class="${p.len === 10 ? "on" : ""}" onclick="S.prac.len=10; practiseModal('${k.id}')">Full · 10 questions</button></div>

    <div class="small muted" style="margin-bottom:6px">What sort?</div>
    <div class="switch" style="margin-bottom:6px">
      <button class="${p.style === "mixed" ? "on" : ""}" onclick="S.prac.style='mixed'; practiseModal('${k.id}')">Mixed</button>
      <button class="${p.style === "past" ? "on" : ""}" onclick="S.prac.style='past'; practiseModal('${k.id}')">Past paper style</button></div>
    <div class="small muted">${p.style === "past"
      ? "Questions written the way they came in old question papers, with the year marked."
      : "A few multiple choice to warm up, then written answers."}</div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="makePractice()" ${p.topics.length || !ts.length ? "" : "disabled"}>Start practising</button>`);
}
function pracTopic(id) {
  const t = S.prac.topics;
  S.prac.topics = t.includes(id) ? t.filter(x => x !== id) : t.concat(id);
  practiseModal(S.prac.class);
}

const PRACTICE_Q = {
  choice: (tp, y) => ({ type:"choice", marks:2,
    prompt:`${y}Which of these is true of ${tp.name.toLowerCase()}?`,
    options:["It only holds for closed loops", "It follows from conservation of energy",
      "It depends on where the observer stands", "It only holds at low speeds"], key:1 }),
  short: (tp, y) => ({ type:"short", marks:3,
    prompt:`${y}State ${tp.name.toLowerCase()} and give one condition under which it fails.` }),
  long: (tp, y) => ({ type:"long", marks:6,
    prompt:`${y}Explain ${tp.name.toLowerCase()}, then work through one numerical example.`,
    marking:[{ what:"Clear statement", marks:2 }, { what:"Worked example", marks:3 }, { what:"Correct units", marks:1 }] })
};

function makePractice() {
  const p = S.prac, k = classOf(p.class);
  const all = topicsOf(k.subject);
  const chosen = (p.topics.length ? all.filter(t => p.topics.includes(t.id)) : all).slice(0, 6);
  const pool = chosen.length ? chosen : all.slice(0, 3);
  if (!pool.length) { toast("This subject has no chapters yet"); return; }

  const t = { id:uid("x"), subject:k.subject, owner:S.me.id, by:"student", kind:"practice",
    counts:false, title:(pool.length === 1 ? pool[0].name : subjectOf(k.subject).title) + " practice",
    minutes:p.len === 5 ? 15 : 30, marks:0, tries:null, instant:true, code:makeCode(subjectOf(k.subject).title) };

  const order = p.style === "past" ? ["long", "short", "long", "short", "long"] : ["choice", "choice", "short", "long", "short"];
  for (let i = 0; i < p.len; i++) {
    const tp = pool[i % pool.length];
    const kind = order[i % order.length];
    const year = p.style === "past" ? `[${2076 + (i % 6)}, Q${1 + (i % 8)}] ` : "";
    const w = writeQuestion(tp.name, kind, i + (p.style === "past" ? 2 : 0));
    const q = { ...w, prompt:year + w.prompt };
    DB.questions.push({ id:uid("q"), test:t.id, topic:tp.id, ...q });
    t.marks += q.marks;
  }
  DB.tests.unshift(t);
  closeModal();
  openModal("Writing your questions", `<div class="row" style="gap:14px">
    <div style="flex:1"><b>${p.len} questions from ${pool.length} chapter${pool.length === 1 ? "" : "s"}</b>
      <div class="small muted" style="margin-top:4px">Taken from your notes and the past papers on this subject.</div>
      <div class="meter" style="margin-top:12px"><i style="width:70%"></i></div></div></div>`, "");
  setTimeout(() => { closeModal(); beginTest(t.id); }, 1100);
}

/* ---------------------------------------------------------------
   Papers handed in on paper.

   Half the exams in the country are still written by hand and scanned.
   The teacher gets the page itself, and marks it the way they would
   with a red pen: tick, cross, a number in the margin, a note.
   --------------------------------------------------------------- */
function scrawl(rnd, x, y, len) {
  /* words, not one long scribble: a few joined strokes, then a gap */
  let d = "", cx = x;
  const end = x + len;
  while (cx < end) {
    const letters = 2 + Math.floor(rnd() * 5);
    d += ` M${cx.toFixed(1)} ${(y + (rnd() - .5) * 2).toFixed(1)}`;
    for (let i = 0; i < letters && cx < end; i++) {
      const w = 7 + rnd() * 8;
      d += ` c ${(w * .3).toFixed(1)} ${(-(5 + rnd() * 9)).toFixed(1)}, ${(w * .7).toFixed(1)} ${(3 + rnd() * 7).toFixed(1)}, ${w.toFixed(1)} ${((rnd() - .5) * 2.4).toFixed(1)}`;
      cx += w;
    }
    cx += 5 + rnd() * 7;
  }
  return d.trim();
}
function sheetSVG(seed, page) {
  const rnd = rng(Math.floor(hash(seed + ":" + page) * 1e6) + 7);
  const W = 800, H = 1040, top = 118, gap = 46, rows = 19;
  let ruled = "", ink = "";
  for (let i = 0; i < rows; i++) {
    const y = top + i * gap;
    ruled += `<line x1="60" y1="${y + 6}" x2="${W - 52}" y2="${y + 6}" stroke="#E7E7E2" stroke-width="1"/>`;
    const roll = rnd();
    if (i === 0) {
      ink += `<path d="${scrawl(rnd, 96, y, 210)}" fill="none" stroke="#1B2A55" stroke-width="2.6" stroke-linecap="round"/>`;
      ink += `<line x1="96" y1="${y + 11}" x2="${306}" y2="${y + 11}" stroke="#1B2A55" stroke-width="1.6"/>`;
      continue;
    }
    if (roll < .10) continue;                                   /* a blank line */
    if (roll < .28) {                                            /* a formula, sitting on its own */
      const x = 150 + rnd() * 90;
      ink += `<path d="${scrawl(rnd, x, y, 90 + rnd() * 60)}" fill="none" stroke="#1B2A55" stroke-width="1.9" stroke-linecap="round"/>`;
      const eq = x + 180 + rnd() * 40;
      ink += `<line x1="${eq}" y1="${y - 5}" x2="${eq + 16}" y2="${y - 5}" stroke="#1B2A55" stroke-width="1.9"/>`;
      ink += `<line x1="${eq}" y1="${y + 1}" x2="${eq + 16}" y2="${y + 1}" stroke="#1B2A55" stroke-width="1.9"/>`;
      ink += `<path d="${scrawl(rnd, eq + 30, y, 70 + rnd() * 90)}" fill="none" stroke="#1B2A55" stroke-width="1.9" stroke-linecap="round"/>`;
      continue;
    }
    if (roll < .38) {                                            /* a numbered part: 2 (b) */
      ink += `<path d="${scrawl(rnd, 62, y, 22)}" fill="none" stroke="#1B2A55" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    const len = 330 + rnd() * 330;
    ink += `<path d="${scrawl(rnd, 96, y, Math.min(len, W - 160))}" fill="none" stroke="#1B2A55" stroke-width="1.9" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="scanned handwritten answer sheet, page ${page}">
    <rect width="${W}" height="${H}" fill="#FFFDF7"/>
    <rect width="${W}" height="${H}" fill="#000" opacity="0.012"/>
    <line x1="88" y1="40" x2="88" y2="${H - 30}" stroke="#D9CFCF" stroke-width="1.4"/>
    <line x1="60" y1="86" x2="${W - 52}" y2="86" stroke="#E7E7E2" stroke-width="1"/>
    ${ruled}${ink}
    <text x="${W - 60}" y="${H - 22}" text-anchor="end" font-family="monospace" font-size="15" fill="#B8B8B3">page ${page}</text>
  </svg>`;
}

        ${pins.map(p => `<div class="pin ${p.kind}" style="left:${p.x}%; top:${p.y}%"
          ${editable ? `onclick="event.stopPropagation(); pinTap('${r.id}','${p.id}')"` : ""}
          title="${editable ? "tap to remove" : ""}">${

      </div>
      ${editable ? `<div class="small muted" style="margin-top:9px">Pick a pen, then tap the page where you want it.

    </div>
    <div class="card pad">

      ${(r.pins || []).filter(p => p.kind === "note").length ? `<hr class="rule">
        <div class="small muted" style="margin-bottom:6px">Notes</div>
        ${(r.pins || []).filter(p => p.kind === "note").map(p => `<div class="small" style="padding:5px 0; border-bottom:1px solid var(--rule-2)">

      ${editable ? `<hr class="rule">
        <div class="small muted" style="margin-bottom:8px">The number on the paper is what counts. Change any
          question's marks below, then publish.</div>

    </div>

}

function pinDrop(rid, page, ev) {
  const r = DB.results.find(x => x.id === rid); if (!r) return;
  const box = ev.currentTarget.getBoundingClientRect();
  const x = ((ev.clientX - box.left) / box.width) * 100;
  const y = ((ev.clientY - box.top) / box.height) * 100;
  const tool = S.pen || "tick";
  if (tool === "note") return askPin(rid, page, x, y, "note");
  if (tool === "marks") return askPin(rid, page, x, y, "marks");
  (r.pins = r.pins || []).push({ id:uid("pin"), page, x, y, kind:tool });
  render();
}
function askPin(rid, page, x, y, kind) {
  openModal(kind === "note" ? "A note on the page" : "Marks for this part", kind === "note"
    ? `<label class="fld"><span>What should they read here?</span>
        <textarea id="pn_t" placeholder="Units missing — this cost you a mark."></textarea></label>`
    : `<label class="fld"><span>How many marks for this part?</span>
        <input id="pn_m" type="number" step="0.5" value="2"></label>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="savePin('${rid}',${page},${x.toFixed(2)},${y.toFixed(2)},'${kind}')">Put it on the page</button>`);
}
function savePin(rid, page, x, y, kind) {
  const r = DB.results.find(v => v.id === rid); if (!r) return;
  const text = kind === "note" ? ($("#pn_t").value.trim() || "See me") : "";
  const marks = kind === "marks" ? (+$("#pn_m").value || 0) : 0;
  (r.pins = r.pins || []).push({ id:uid("pin"), page, x, y, kind, text, marks });
  closeModal(); render();
}
function pinTap(rid, pid) {
  const r = DB.results.find(x => x.id === rid); if (!r) return;
  r.pins = (r.pins || []).filter(p => p.id !== pid);
  render();
}
function undoPin(rid) {
  const r = DB.results.find(x => x.id === rid);
  if (!r || !r.pins || !r.pins.length) { toast("Nothing to undo"); return; }
  r.pins.pop(); render();
}
function attachSheet(rid) {

/* ---------------------------------------------------------------
   Writing a question, and writing it again differently.

   Every question knows which chapter it came from and how many times
   it has been rewritten, so "Rewrite" never hands back the same words.
   --------------------------------------------------------------- */
const Q_CHOICE = [
  n => ({ prompt:`Which of these is true of ${n}?`,
    options:["It only holds for closed loops", "It follows from conservation of energy",
      "It depends on where the observer stands", "It only holds at low speeds"], key:1 }),
  n => ({ prompt:`A question on ${n} gives you the wrong answer if you forget which quantity?`,
    options:["The direction of the normal", "The mass of the conductor",
      "The colour of the wire", "The room temperature"], key:0 }),
  n => ({ prompt:`In an exam, the commonest mistake with ${n} is:`,
    options:["Using degrees where radians are wanted", "Writing the statement before the formula",
      "Drawing the diagram first", "Checking the units at the end"], key:0 }),
  n => ({ prompt:`${n[0].toUpperCase() + n.slice(1)} is best described as:`,
    options:["An approximation that fails above 1 kHz", "A law relating a cause to what opposes it",
      "A rule of thumb with no derivation", "A special case of Ohm's law"], key:1 })
];
const Q_SHORT = [
  n => ({ prompt:`State ${n} and give one condition under which it fails.` }),
  n => ({ prompt:`Define ${n} in one sentence, then write its formula and name every symbol.` }),
  n => ({ prompt:`Where does ${n} come from? Two lines, no derivation.` }),
  n => ({ prompt:`Give one real use of ${n} and say which quantity you would measure.` })
];
const Q_LONG = [
  n => ({ prompt:`Explain ${n}, then work through one numerical example.`,
    marking:[{ what:"Clear statement", marks:2 }, { what:"Worked example", marks:3 }, { what:"Correct units", marks:1 }] }),
  n => ({ prompt:`Derive the expression used in ${n} from first principles, stating every assumption.`,
    marking:[{ what:"Assumptions stated", marks:2 }, { what:"Correct derivation", marks:3 }, { what:"Final expression", marks:1 }] }),
  n => ({ prompt:`A student says ${n} does not apply here. Say whether they are right and justify it with a diagram.`,
    marking:[{ what:"Correct judgement", marks:2 }, { what:"Diagram", marks:2 }, { what:"Justification", marks:2 }] }),
  n => ({ prompt:`Compare ${n} with the chapter before it: what changes, and what stays the same?`,
    marking:[{ what:"Both stated correctly", marks:3 }, { what:"A real difference named", marks:2 }, { what:"An example", marks:1 }] })
];
function writeQuestion(topicName, type, n) {
  const name = (topicName || "this chapter").toLowerCase();
  const pick3 = arr => arr[Math.abs(n || 0) % arr.length](name);
  if (type === "choice") return { type:"choice", marks:2, ...pick3(Q_CHOICE) };
  if (type === "short") return { type:"short", marks:3, ...pick3(Q_SHORT) };
  return { type:"long", marks:6, ...pick3(Q_LONG) };
}

function regenQuestion(qid) {
  const q = DB.questions.find(x => x.id === qid); if (!q) return;
  q.busy = true; render();
  setTimeout(() => {
    const tp = topicById(q.topic);
    q.gen = (q.gen || 0) + 1;
    const fresh = writeQuestion(tp ? tp.name : "", q.type, q.gen);
    q.prompt = fresh.prompt; q.marks = fresh.marks;
    if (fresh.options) { q.options = fresh.options; q.key = fresh.key; } else { delete q.options; delete q.key; }
    if (fresh.marking) q.marking = fresh.marking; else delete q.marking;
    delete q.busy;
    toast("Rewritten — same chapter, different question");
    render();
  }, 900);
}
function retypeQuestion(qid, type) {
  const q = DB.questions.find(x => x.id === qid); if (!q) return;
  q.type = type; q.gen = (q.gen || 0) + 1;
  const tp = topicById(q.topic), fresh = writeQuestion(tp ? tp.name : "", type, q.gen);
  Object.assign(q, fresh);
  if (!fresh.options) { delete q.options; delete q.key; }
  if (!fresh.marking) delete q.marking;
  render();
}

/* ---------------------------------------------------------------
   A subject, as a teacher builds it: what it is, its syllabus, the
   notes it is taught from and the papers it has been examined by.

   A class comes later — the same subject is taught to several groups.
   --------------------------------------------------------------- */
const UNIS = ["Tribhuvan University", "Pokhara University", "Kathmandu University",
  "Purbanchal University", "Mid-West University", "Other"];
const PROGRAMMES = ["BE Electronics (BEI)", "BE Computer (BCT)", "BE Civil", "BE Electrical",
  "BE Mechanical", "BSc CSIT", "BCA", "Other"];

function subjectsOfTeacher() {
  if (S.me.role === "teacher") return S.teacherBackend.subjects;
  const taught = classesOfTeacher(S.me.id).map(k => k.subject);
  return DB.subjects.filter(s => s.owner === S.me.id || taught.includes(s.id));
}
function isLiveSubject(sid) { return S.teacherBackend.subjects.some(subject => subject.id === sid); }
function documentsOf(sid) {
  return isLiveSubject(sid) ? S.teacherBackend.documents.filter(item => item.subject === sid) : [];
}
function syllabusFilesOf(sid) {
  return isLiveSubject(sid) ? documentsOf(sid).filter(item => item.kind === "Syllabus") : [];
}
function materialOf(sid) {
  return isLiveSubject(sid)
    ? documentsOf(sid).filter(item => item.kind !== "Past papers" && item.kind !== "Syllabus")
    : DB.material.filter(item => item.subject === sid);
}
function bankOf(sid) {
  return isLiveSubject(sid)
    ? documentsOf(sid).filter(item => item.kind === "Past papers")
    : (DB.bank || []).filter(b => b.subject === sid);
}
function chaptersOf(sid) { return DB.syllabus[sid] || []; }
function indexTopics() {
  Object.entries(DB.syllabus).forEach(([sid, chs]) => chs.forEach(ch =>
    ch.topics.forEach(t => TOPIC_INDEX[t.id] = { ...t, subject:sid, chapter:ch.chapter })));
}

/* --- reading a syllabus that was typed, pasted or uploaded --- */
function parseSyllabus(text) {
  const out = [];
  let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/^[\s•\-–*]+/, "").trim();
    if (!line) return;
    const head = /^(unit|chapter|module|part)\b/i.test(line) || /^\d+[\.\)]\s/.test(line) || /:$/.test(line);
    const hours = /\((\d+)\s*(hrs?|hours?|lh)\)/i.exec(line);
    if (head) {
      const label = /^(unit|chapter|module|part)\s*\d*/i.exec(line);
      const rest = line.replace(/^(unit|chapter|module|part)\s*[:\-]?\s*\d*[\.\):]?\s*/i, "")
        .replace(/^\d+[\.\)]\s*/, "").replace(/:$/, "").replace(/\(.*?\)/g, "").trim();
      const listed = /[,;]/.test(rest);
      cur = { chapter:(listed ? (label ? label[0] : "Unit") : rest) || line.replace(/:$/, ""),
        topics:[], hours:hours ? +hours[1] : null };
      out.push(cur);
      if (listed) rest.split(/[,;]/).forEach(t => t.trim() && cur.topics.push(t.trim()));
      return;
    }
    if (!cur) { cur = { chapter:"Syllabus", topics:[] }; out.push(cur); }
    line.split(/[,;]/).forEach(t => { const v = t.trim().replace(/\(.*?\)/g, "").trim(); if (v) cur.topics.push(v); });
  });
  return out.filter(c => c.chapter);
}
function mockChapters(name) {
  return [1, 2, 3, 4].map(i => ({ chapter:`Unit ${i}`, topics:[`${name || "Topic"} ${i}.1`, `${name || "Topic"} ${i}.2`, `${name || "Topic"} ${i}.3`] }));
}
function chaptersToSyllabus(list) {
  return list.map(c => ({ chapter:c.chapter, hours:c.hours || null,
    topics:c.topics.slice(0, 12).map(n => ({ id:uid("t"), name:n, hard:.3 + Math.random() * .5 })) }));
}

/* --- the three-step wizard --- */
function newSubject(step) {
  if (!S.newsub) S.newsub = { step:1, name:"", code:"", uni:UNIS[0], prog:PROGRAMMES[0], sem:"1",
    chapters:[], notes:[], bank:[], raw:"" };

  const dots = `<div class="stages">${["What it is", "Syllabus", "Material"].map((label, idx) => {
    const i = idx + 1, state = n.step > i ? "done" : n.step === i ? "now" : "";
    return `${idx ? `<div class="stage-line"></div>` : ""}<div class="stage ${state}"><span class="num">${n.step > i ? "✓" : i}</span><span class="lbl">${label}</span></div>`;
  }).join("")}</div>`;

  const showUniOther = n.uni === "Other";
  const showProgOther = n.prog === "Other";
  const body = n.step === 1 ? `${dots}
    <label class="fld"><span>Subject name</span><input id="ns_n" type="text" value="${esc(n.name)}" placeholder="Engineering Physics I"></label>
    <div class="grid g2">

        <select id="ns_u" onchange="captureSubject(); S.newsub.uni=this.value; newSubject(1)">
          ${UNIS.map(u => `<option ${n.uni === u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>
        ${showUniOther ? `<input id="ns_u_other" type="text" value="${esc(n.uniOther||"")}" placeholder="University name" style="margin-top:8px">` : ""}</label>
      <label class="fld"><span>Programme</span>
        <select id="ns_p" onchange="captureSubject(); S.newsub.prog=this.value; newSubject(1)">
          ${PROGRAMMES.map(p => `<option ${n.prog === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
        ${showProgOther ? `<input id="ns_p_other" type="text" value="${esc(n.progOther||"")}" placeholder="Programme name" style="margin-top:8px">` : ""}</label></div>
    `

  : n.step === 2 ? `${dots}
    <div class="small muted" style="margin-bottom:10px">Upload the syllabus your university publishes, or paste it in.
      We pull the units and topics out — the chapter map is built from them.</div>
    <div class="drop" onclick="document.getElementById('ns_f').click()">
      <b>Drop the syllabus here, or tap to choose</b>
      <div class="small muted">PDF, Word or plain text</div></div>
    <input type="file" id="ns_f" accept=".pdf,.doc,.docx,.txt,.md" style="display:none" onchange="tookSyllabus(this)">
    <label class="fld" style="margin-top:14px"><span>Or paste it</span>

function captureSubject() {

  set("uniOther", "ns_u_other"); set("progOther", "ns_p_other");
}
function readSyllabus() {

function tookSyllabus(input) {

function createSubject() {
  captureSubject();
  const n = S.newsub;
  if (!n.name.trim()) { toast("Give the subject a name first"); newSubject(1); return; }
  const sid = uid("s");
  const uni = n.uni === "Other" ? (n.uniOther || "").trim() || "Other" : n.uni;
  const prog = n.prog === "Other" ? (n.progOther || "").trim() || "Other" : n.prog;
  DB.subjects.push({ id:sid, title:n.name.trim(), code:"", semester:+n.sem || 1,
    university:uni, programme:prog, owner:S.me.id,
    blurb:`${prog} · semester ${n.sem} · ${uni}` });
  DB.syllabus[sid] = chaptersToSyllabus(n.chapters.length ? n.chapters : []);
  indexTopics();
  n.notes.forEach(f => DB.material.push({ id:uid("m"), subject:sid, name:f.name, kind:"Notes", size:f.size, state:"preparing" }));
  DB.bank = DB.bank || [];
  n.bank.forEach(f => DB.bank.push({ id:uid("b"), subject:sid, name:f.name, size:f.size, state:"preparing", found:0 }));
  const mats = DB.material.filter(m => m.subject === sid), banks = bankOf(sid);

    banks.forEach(b => { b.state = "ready"; b.found = 12 + Math.floor(Math.random() * 30); });

function setTestChatPrompt(text) { const input = $("#test_chat"); if (!input) return; input.value = text; input.focus(); }
function testChatResponse(sid, text) {
  const matched = REPLIES.find(reply => reply.when.test(text));
  const material = DB.material.filter(item => item.subject === sid && item.state === "ready").slice(0, 2)
    .map(item => ({ name:item.name, where:item.kind || "material" }));
  if (matched) return { text:matched.text, sources:material.length ? material : matched.sources };
  return { text:`Here is a draft student-facing answer for ${subjectOf(sid).title}.\n\nIt draws only on the material available for this subject. Start with the key idea, then show the method or formula step by step.`,
    sources:material.length ? material : [{ name:subjectOf(sid).title, where:"subject material" }] };
}
function sendTestChat(sid) {
  const input = $("#test_chat"), text = input && input.value.trim();
  if (!text) return;
  const chat = testChatState(sid);
  if (chat.busy) return;
  if (isLiveSubject(sid)) { sendLiveTestChat(sid, text, chat); return; }
  const reply = testChatResponse(sid, text);
  chat.messages.push({ from:"you", text, at:now() }, { from:"tutor", text:reply.text, sources:reply.sources, at:now() });
  render();
  setTimeout(() => { const next = $("#test_chat"); if (next) next.focus(); }, 40);
}
async function sendLiveTestChat(sid, text, chat) {
  const subject = subjectOf(sid);
  if (!subject || !subject.apiSlug) { toast("This subject is missing its backend scope."); return; }
  const history = chat.messages.filter(message => !message.busy && !message.error).slice(-10).map(message => ({
    role:message.from === "you" ? "user" : "assistant", content:message.text
  }));
  const pending = { from:"tutor", text:"", sources:[], busy:true, live:true, at:now() };
  chat.busy = true;
  chat.messages.push({ from:"you", text, at:now() }, pending);
  render();
  try {
    const response = await fetch("/api/teacher/answer", {
      method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
      body:JSON.stringify({ question:text, subjectSlug:subject.apiSlug, history })
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || "Could not answer from this subject.");
    pending.text = payload.answer || "The backend returned no answer.";
    pending.sources = Array.isArray(payload.sources) ? payload.sources : [];
    pending.answerId = payload.answerId || "";
    pending.qualityScore = payload.qualityScore;
    pending.busy = false;
  } catch (error) {
    pending.text = error instanceof Error ? error.message : "Could not answer from this subject.";
    pending.error = true;
    pending.busy = false;
  }
  chat.busy = false;
  render();
  setTimeout(() => { const next = $("#test_chat"); if (next) next.focus(); }, 40);
}
function clearTestChat(sid) { const chat = testChatState(sid); chat.messages = []; chat.busy = false; render(); }

  if (/\.(txt|md)$/i.test(f.name)) { const rd = new FileReader();
    rd.onload = () => open(parseSyllabus(rd.result)); rd.readAsText(f); return; }
  open(mockChapters(subjectOf(sid).title.split(" ")[0]));
}
function uploadReview(sid) {
  const u = S.uplo; if (!u || !u.chapters.length) { uploadSyllabusTo(sid); return; }
  const topics = u.chapters.reduce((a, c) => a + c.topics.length, 0);
  const body = `
    <div class="small muted" style="margin-bottom:14px">We read <b>${u.chapters.length} unit${u.chapters.length === 1 ? "" : "s"}</b>
      and <b>${topics} topic${topics === 1 ? "" : "s"}</b>${u.file ? ` from ${esc(u.file)}` : ""}.
      Keep what's real and remove anything that isn't a unit — only what's left gets added.</div>
    ${u.chapters.map((c, i) => `<div class="uplo-unit">
      <div class="row"><span class="chip">Unit ${i + 1}</span><b style="margin-left:8px">${esc(c.chapter)}</b>
        <span class="spacer"></span><button class="btn quiet sm" onclick="dropUpload(${i})">Remove</button></div>
      ${c.topics.length ? `<div class="row" style="gap:5px; margin-top:7px; flex-wrap:wrap">${c.topics.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>`
        : `<div class="small muted" style="margin-top:5px">No topics under this unit.</div>`}
      </div>`).join("")}`;
  const foot = `<button class="btn ghost" onclick="uploadSyllabusTo('${sid}')">Back</button>
     <button class="btn" onclick="commitUpload('${sid}')">Add ${u.chapters.length} unit${u.chapters.length === 1 ? "" : "s"}</button>`;
  openModal("Check the syllabus", body, foot, "big");
}
function dropUpload(i) {
  if (!S.uplo) return;
  const sid = S.uplo.sid;
  S.uplo.chapters.splice(i, 1);
  if (!S.uplo.chapters.length) { toast("All units removed"); uploadSyllabusTo(sid); return; }
  uploadReview(sid);
}
function commitUpload(sid) {
  const u = S.uplo; if (!u || !u.chapters.length) { toast("Nothing to add"); return; }
  DB.syllabus[sid] = (DB.syllabus[sid] || []).concat(chaptersToSyllabus(u.chapters));
  indexTopics(); const n = u.chapters.length; S.uplo = null;
  closeModal(); toast(`${n} unit${n === 1 ? "" : "s"} added`); render();
}
function addBank(sid) {
  openModal("Past papers and question banks", `
    <div class="small muted" style="margin-bottom:12px">Every question you have been set before. New questions come out
      in the same style, with the same weight on the same chapters.</div>
    <div class="drop" onclick="document.getElementById('ab_f').click()"><b>Choose the papers</b>
      <div class="small muted">PDF or Word, several at once</div></div>
    <input type="file" id="ab_f" multiple style="display:none" onchange="gotBank('${sid}', this)">`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>`);
}
function gotBank(sid, input) {
  DB.bank = DB.bank || [];
  const added = [...input.files].map(f => { const b = { id:uid("b"), subject:sid, name:f.name,
    size:(f.size / 1048576).toFixed(1) + " MB", state:"preparing", found:0 }; DB.bank.push(b); return b; });
  closeModal(); toast(`${added.length} paper${added.length === 1 ? "" : "s"} added — reading them`); render();
  setTimeout(() => { added.forEach(b => { b.state = "ready"; b.found = 12 + Math.floor(Math.random() * 30); });
    toast("Question bank ready"); render(); }, 2600);
}

/* ---------------------------------------------------------------
   An exam, seen from inside a class.

   Everything for one exam and one class on a single page: its
   questions, when this class sits it, and their papers as they come
   in. The paper-vs-sitting split still exists underneath (one paper
   can go to two classes) but a teacher never has to think about it.
   --------------------------------------------------------------- */
function classExam(cid, tid) {
  const k = classOf(cid), t = testOf(tid);
  if (!k || !t) return { html:`<div class="empty"><b>Exam not found</b></div>`, crumbs:"Classrooms" };
  if (!k.teachers.includes(S.me.id)) return { html:`<div class="empty"><b>Not your classroom</b></div>`, crumbs:"Classrooms" };
  const subj = subjectOf(k.subject);
  const qs = DB.questions.filter(q => q.test === tid);
  const g = DB.givings.find(x => x.test === tid && x.class === cid);
  const rs = DB.results.filter(r => r.test === tid && r.class === cid);
  const waiting = rs.filter(r => !r.published);
  const roster = studentsOfClass(cid);
  const used = qs.reduce((n, q) => n + q.marks, 0);
  const otherClasses = DB.givings.filter(x => x.test === tid && x.class !== cid).length;

  const opts = [["questions", "Questions", qs.length], ["papers", "Submissions", rs.length]];
  const tab = pick("cx", opts);

  const questionsPane = `
    <div class="row" style="margin-bottom:14px">
      <button class="btn" onclick="draftQuestions('${tid}')">Write questions for me</button>
      <button class="btn ghost" onclick="addQuestion('${tid}')">Add one myself</button>
      <span class="spacer"></span>
      <span class="chip ${used === t.marks ? "line" : ""}">${used} of ${t.marks} marks used</span></div>
    ${t.drafting ? `<div class="card pad" style="margin-bottom:12px"><b>Writing questions from your material…</b>
      <div class="meter" style="margin-top:10px"><i style="width:45%"></i></div>
      <div class="small muted" style="margin-top:8px">You can leave this page.</div></div>` : ""}
    ${qs.length ? qs.map((q, i) => `<div class="card pad" style="margin-bottom:10px">
      <div class="row" style="margin-bottom:7px"><span class="chip">Question ${i + 1}</span>
        <span class="chip">${q.type === "choice" ? "Multiple choice" : q.type === "short" ? "Short answer" : "Long answer"}</span>
        <span class="chip line">${q.marks} ${q.marks === 1 ? "mark" : "marks"}</span>
        ${q.topic && topicById(q.topic) ? `<span class="chip">${esc(topicById(q.topic).name)}</span>` : ""}
        <span class="spacer"></span>
        <button class="btn ghost sm" onclick="regenQuestion('${q.id}')" ${q.busy ? "disabled" : ""}>${q.busy ? "Rewriting…" : "Rewrite"}</button>
        <button class="btn quiet sm" onclick="dropQuestion('${q.id}')">Remove</button></div>
      <div ${q.busy ? 'style="opacity:.4"' : ""}>${esc(q.prompt)}</div>
      ${q.options ? `<div class="small muted" style="margin-top:9px">${q.options.map((o, oi) =>
        `<div>${String.fromCharCode(97 + oi)}) ${esc(o)}${oi === q.key ? " <b>· correct</b>" : ""}</div>`).join("")}</div>` : ""}
      ${q.marking ? `<div style="margin-top:10px"><div class="small muted" style="margin-bottom:5px">Marks are given for</div>
        ${q.marking.map(m => `<span class="chip">${esc(m.what)} · ${m.marks}</span> `).join("")}</div>` : ""}
      <div class="row" style="margin-top:10px"><span class="small muted">Ask for it as</span>
        ${[["choice", "Multiple choice"], ["short", "Short answer"], ["long", "Long answer"]].map(([v, l]) =>
          `<button class="btn quiet sm" ${q.type === v ? "disabled" : ""} onclick="retypeQuestion('${q.id}','${v}')">${l}</button>`).join("")}</div>
    </div>`).join("") : `<div class="empty"><b>No questions yet</b>Have them drafted from your material, or write your own.
      <div class="row" style="margin-top:14px; justify-content:center">
        <button class="btn" onclick="draftQuestions('${tid}')">Write questions for me</button>
        <button class="btn ghost" onclick="addQuestion('${tid}')">Add one myself</button></div></div>`}`;

  const w = g ? windowState(g) : null;
  const whenPane = `
    ${g ? `<div class="card pad" style="margin-bottom:14px"><div class="row">
      <div>${windowChip(g)}<span style="margin-left:8px" class="small muted">${
        w.state === "before" ? "This classroom can't start it yet." :
        w.state === "open" ? "This classroom can sit it now." : "Closed for this classroom."}</span></div>
      <span class="spacer"></span>
      <button class="btn ghost sm" onclick="giveToClass('${tid}','${cid}')">Change the dates</button></div></div>`
    : `<div class="hero" style="margin-bottom:14px"><div style="min-width:0">
        <h2>This classroom hasn't been given the exam yet</h2>
        <div class="sub">Set a window — or leave the dates blank so they can sit it whenever.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="giveToClass('${tid}','${cid}')">Set the date</button></div>`}
    <div class="card pad">
      <div class="row"><b>Share it with ${esc(classCode(k))}</b><span class="spacer"></span>
        <button class="btn ghost sm" onclick="shareCode('test','${tid}','${cid}')">Code and QR</button>
        ${qs.length ? `<button class="btn ghost sm" onclick="printPaper('${tid}')">Print the paper</button>` : ""}</div>
      <div class="small muted" style="margin-top:6px">Students in this classroom see it in their Exams the moment it opens.</div>
    </div>
    ${otherClasses ? `<div class="card pad flat" style="margin-top:14px"><div class="small">
      This same paper also goes to ${otherClasses} other class${otherClasses === 1 ? "" : "es"}, each with its own dates and marks.
      <button class="btn quiet sm" onclick="whereElse('${tid}','${cid}')">See where else</button></div></div>` : ""}`;

  const papersPane = `
    <div class="card pad" style="margin-bottom:14px">
      <div class="row">
        <div>${g ? windowChip(g) : `<span class="chip solid">no date set</span>`}
          <span class="small muted" style="margin-left:8px">${
            !g ? "Set a date so this classroom can sit it." :
            w.state === "before" ? "Hasn't opened yet." :
            w.state === "open" ? "Students can sit it now." : "Window closed."}</span></div>
        <span class="spacer"></span>
        <button class="btn ghost sm" onclick="giveToClass('${tid}','${cid}')">${g ? "Change dates" : "Set dates"}</button>
        ${qs.length ? `<button class="btn ghost sm" onclick="printPaper('${tid}')">Print</button>` : ""}
        <button class="btn ghost sm" onclick="shareCode('test','${tid}','${cid}')">Share code</button>
      </div>
    </div>
    ${!rs.length
      ? `<div class="empty"><b>No submissions yet</b>${g ? "Papers appear here the moment students hand them in." : "Set a date first."}</div>`
      : `<div class="card pad" style="margin-bottom:14px"><div class="row">
          <div><b>${rs.length} of ${roster.length} submitted</b>
            <div class="small muted">${waiting.length ? waiting.length + " waiting to be published" : "All published — students can see their marks"}</div></div>
          <span class="spacer"></span>
          ${waiting.length ? `<button class="btn" onclick="publishFor('${cid}','${tid}')">Publish all ${waiting.length}</button>` : ""}
          <button class="btn ghost" onclick="bulkAdjust('${tid}','${cid}')">Adjust a question for all</button></div></div>
        <div class="tiles">${rs.map(r => `<a class="tile ${r.published ? "" : "todo-now"}" href="#/results/${r.id}">
          <div class="row"><div class="avatar">${esc(initials(person(r.student).name))}</div>
            <div style="min-width:0"><h3 style="margin:0">${esc(person(r.student).name)}</h3>
              <div class="sub">${r.sheet ? "handed in on paper" : "typed"}</div></div></div>
          <div class="foot"><span class="mark">${r.score}<small>/${r.outOf}</small></span><span class="spacer"></span>
            ${r.published ? `<span class="chip">published</span>` : `<span class="chip solid">check &amp; publish</span>`}</div></a>`).join("")}</div>`}`;

  const panes = { questions:() => questionsPane, papers:() => papersPane };

  const html = `
    <div class="pagehead">
      <div><div class="eyebrow">${esc(classCode(k))}<span class="sep">·</span>${esc(subj.title)}</div>
        <h1>${esc(t.title)}</h1>
        <p>${t.kind} · ${t.marks} marks · ${t.minutes ? t.minutes + " minutes" : "no time limit"}${
          g ? " · " + windowState(g).label.toLowerCase() : " · no date set"}</p></div>
      <span class="spacer"></span>
      <div class="row"><button class="btn ghost" onclick="renameExam('${tid}')">Rename</button>
        <button class="btn ghost" onclick="duplicateTest('${tid}')">Copy</button>
        <a class="btn ghost" href="#/exams">Save &amp; go to exams</a>
        <button class="btn" onclick="publishExam('${tid}')">Publish →</button></div>
    </div>
    ${qs.length && !g ? `<div class="hero" style="margin-bottom:18px"><div style="min-width:0">
      <h2>Paper ready — choose a classroom to publish to</h2>
      <div class="sub">Set a date or leave it open so they can sit it whenever.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="publishExam('${tid}')">Publish to a classroom →</button></div>` : ""}
    ${waiting.length ? `<div class="hero" style="margin-bottom:18px"><div style="min-width:0">
      <h2>${waiting.length} papers ready to publish</h2>
      <div class="sub">This classroom can't see their marks until you publish.</div></div>
      <span class="spacer"></span>
      <button class="btn big" onclick="publishFor('${cid}','${tid}')">Publish all ${waiting.length}</button></div>` : ""}
    ${tabs("cx", opts)}
    ${panes[tab]()}`;
  return { html, crumbs:`<a href="#/classes">Classrooms</a> / <a href="#/class/${cid}">${esc(classCode(k))}</a> / <b>${esc(t.title)}</b>` };
}

function createClassExam(cid) {

    kind:$("#ne_k").value, counts:true, title:$("#ne_t").value.trim() || "New exam",

function renameExam(tid) {

  openModal("Rename this exam", `
    <label class="fld"><span>Name</span><input id="rn_t" type="text" value="${esc(t.title)}"></label>
    <div class="grid g2">
      <label class="fld"><span>Total marks</span><input id="rn_s" type="number" value="${t.marks}"></label>

function whereElse(tid, cid) {

    const rs = DB.results.filter(r => r.test === tid && r.class === g.class);

function giveOtherClasses(tid, cid) {

  openModal("Give it to another classroom", `

/* ================= one paper =================
   There is no separate Results page any more. A student's marks live on
   the "Done" side of Exams; a teacher's live on the "Results" side.

function pageResult(id) {

    ? [["paper", mineToMark ? "Their paper" : "My paper"], ["answers", "Answers & Feedback"], ["summary", "Summary"]]

  const summary = `<div class="grid g2">
      <div class="card pad"><h3>What the marker said</h3><hr class="rule">

            ${r.lost.map(g => `<div class="small" style="margin-bottom:5px"><span class="tick">→</span>${esc(g)}</div>`).join("")}</div></div></div>

        <div class="row" style="align-items:flex-end; gap:20px">
          <div><div class="small muted">Percentage</div>
            <div style="font-family:var(--display); font-size:38px; letter-spacing:-.045em; line-height:1.1">${p}%</div></div>
          <div style="flex:1">${bar(p / 100)}</div></div>
        ${classSpread(r)}</div>
    </div>`;

  const answers = `
    ${mineToMark ? `<div class="row" style="margin-bottom:14px"><span class="spacer"></span>
      <button class="btn ghost sm" onclick="bulkAdjust('${r.test}','${r.class}')">Adjust a question for everyone</button></div>` : ""}

          <div class="row"><span class="chip">Question ${i + 1}</span>
            <span class="chip ${l.max && l.got === l.max ? "line" : ""}">${l.got} / ${l.max} marks</span>
            <span class="spacer"></span>
            ${mineToMark ? `<button class="btn quiet sm" onclick="adjust('${r.id}',${i})">Change marks</button>` : ""}
          </div>
          <div style="margin-top:8px; font-weight:500">${esc(l.prompt)}</div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:80px">
          <div class="pad" style="border-right:1px solid var(--rule)">
            <div class="small muted" style="margin-bottom:6px; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em">Student answer</div>
            <div class="small" style="white-space:pre-wrap">${l.answer ? esc(l.answer) : `<span class="muted">No answer given</span>`}</div>
          </div>
          <div class="pad">
            <div class="small muted" style="margin-bottom:6px; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em">Feedback</div>
            <div class="small">${esc(l.note || "—")}</div>
            ${l.teacher ? `<div class="small" style="margin-top:8px; padding-top:8px; border-top:1px solid var(--rule-2)"><b>Teacher note:</b> ${esc(l.teacher)}</div>` : ""}

          </div>
        </div>
      </div>`).join("")}`;

  const panes = { paper:() => paperPanel(r, mineToMark), answers:() => answers, summary:() => summary };

  const html = `
    <div class="pagehead">
      <div><div class="row" style="margin-bottom:8px">
        ${r.counts ? `<span class="chip line">counts towards the record</span>` : `<span class="chip">practice only</span>`}
        <span class="chip ${r.published ? "" : "solid"}">${r.published ? "published" : "not published yet"}</span>
        ${hasPaper ? `<span class="chip">handed in on paper</span>` : ""}
        ${r.class ? `<span class="chip">${esc(groupOf(classOf(r.class).group).name)}</span>` : ""}</div>
        <h1>${esc(t.title)}</h1>
        <p>${esc(subjectOf(r.subject).title)} · ${esc(person(r.student).name)} · ${fmtFull(r.at)}</p></div>
      <span class="spacer"></span>
      ${mineToMark && !hasPaper ? `<button class="btn ghost" onclick="attachSheet('${r.id}')">Attach the scan</button>` : ""}
      ${mineToMark && !r.published ? `<button class="btn big" onclick="publishOne('${r.id}')">Publish this result</button>` : ""}
      <div class="score">${r.score}<small>of ${r.outOf}</small></div></div>
    ${tabs("res", opts)}
    ${panes[tab]()}`;
  return { html, crumbs:mineToMark && r.class
    ? `<a href="#/classes">Classrooms</a> / <a href="#/class/${r.class}">${esc(classCode(classOf(r.class)))}</a> / <a href="#/class/${r.class}/exam/${r.test}">${esc(t.title)}</a> / <b>${esc(person(r.student).name)}</b>`
    : `<a href="#/exams">Exams</a> / <b>${esc(t.title)}</b>` };
}
function publishOne(rid) {
  const r = DB.results.find(x => x.id === rid); if (!r) return;
  r.published = true; r.checked = true;
  toast(esc(person(r.student).name.split(" ")[0]) + " can see this mark now"); render();
}
function classSpread(r) {
  if (!r.class) return "";
  const rs = DB.results.filter(x => x.test === r.test && x.class === r.class);
  if (rs.length < 3) return "";
  const bands = new Array(5).fill(0);
  rs.forEach(x => bands[Math.min(4, Math.floor(x.score/x.outOf*5))]++);
  const mine = Math.min(4, Math.floor(r.score/r.outOf*5)), max = Math.max(...bands);
  const avg = Math.round(rs.reduce((a, x) => a + x.score/x.outOf, 0)/rs.length*100);
  const below = rs.filter(x => x.score/x.outOf < r.score/r.outOf).length;
  return `<hr class="rule"><div class="small muted" style="margin-bottom:8px">How the group did · average ${avg}%</div>
    <div class="bars" style="height:60px">${bands.map((n, i) => `<div style="height:${Math.max(6, n/max*100)}%; ${i===mine?"":"opacity:.28"}">
      <span>${i*20}–${i*20+19}</span></div>`).join("")}</div>
    <div class="small muted" style="margin-top:26px">Ahead of ${below} of the other ${rs.length-1}.</div>`;
}
function adjust(rid, i) {
  const r = DB.results.find(x => x.id === rid), l = r.lines[i];
  openModal("Change the marks", `
    <div class="card pad flat" style="margin-bottom:14px"><div class="small muted" style="margin-bottom:4px">Question</div>
      <div>${esc(l.prompt)}</div><div class="small muted" style="margin-top:8px">Marked automatically as ${l.got} of ${l.max}</div></div>
    <div class="grid g2"><label class="fld"><span>Marks</span><input id="ad_m" type="number" step="0.5" max="${l.max}" value="${l.got}"></label>
      <label class="fld"><span>Out of</span><input type="number" value="${l.max}" disabled></label></div>
    <label class="fld"><span>A note for the student</span><textarea id="ad_c">${esc(l.teacher || "")}</textarea></label>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAdjust('${rid}',${i})">Save</button>`);
}
function saveAdjust(rid, i) {
  const r = DB.results.find(x => x.id === rid), l = r.lines[i];
  l.got = Math.min(+$("#ad_m").value, l.max); l.teacher = $("#ad_c").value.trim();
  r.score = r.lines.reduce((n, x) => n + x.got, 0); r.checked = true;
  closeModal(); toast("Marks changed"); render();
}

/* ---------------------------------------------------------------
   Ask — a chat, not a workspace.

   No conversation list down the side, no folders. One thread, one box,
   the subject picked with a chip, and the old threads behind one button.
   --------------------------------------------------------------- */
function askableClasses() {
  return S.me.role === "teacher" ? classesOfTeacher(S.me.id).filter(k => k.term === S.term) : myClasses();
}

function pageAsk(id) {
  const mine = DB.chats.filter(c => c.user === S.me.id);
  const ks = askableClasses();
  let cur = (id && DB.chats.find(c => c.id === id))
    || (S.ask.chat && mine.find(c => c.id === S.ask.chat)) || mine[0];
  if (!cur) {
    if (!ks.length) return { html:`<div class="pagehead"><div><h1>Ask</h1>
      <p>Answers come from your own subject's notes and past papers, not from the open internet.</p></div></div>
      <div class="empty"><b>Join a subject first</b>The tutor answers from that subject's material.
      <div style="margin-top:14px"><button class="btn" onclick="enterCode()">Join with a code</button></div></div>`, crumbs:"Ask" };
    cur = { id:uid("ch"), class:ks[0].id, user:S.me.id, title:"New question", at:now() };
    DB.chats.unshift(cur);
  }
  S.ask.chat = cur.id;
  const msgs = DB.msgs.filter(m => m.chat === cur.id);
  const k = classOf(cur.class);
  const mode = S.ask.mode || "explain";

  /* suggestions: their own weak chapters first, then the two things
     every student in the country actually types */
  const weak = k ? topicsOf(k.subject).map(t => ({ ...t, v:topicScore(S.me.id, t.id, "tests") }))
    .filter(t => t.v !== null && t.v < .55).sort((a, b) => a.v - b.v).slice(0, 2) : [];
  const sug = weak.map(t => "Explain " + t.name.toLowerCase() + " simply")
    .concat(["What comes in the exam from this chapter?", "Solve one past paper question step by step"]);

  const html = `
    <div class="pagehead"><div><h1>Ask</h1>
      <p>Answers come from ${esc(k ? subjectOf(k.subject).title : "your subject")} — its notes, its past papers. Not the open internet.</p></div>
      <span class="spacer"></span>
      <button class="btn ghost" onclick="pastChats()">Past questions${mine.length > 1 ? " · " + mine.length : ""}</button>
      <button class="btn ghost" onclick="keptModal()">Saved answers${DB.kept.filter(x => x.by === S.me.id).length ? " · " + DB.kept.filter(x => x.by === S.me.id).length : ""}</button>
      <button class="btn" onclick="startAsk('${k ? k.id : ""}')">New question</button></div>

    ${ks.length > 1 ? `<div class="subjrow">${ks.map(x =>
      `<button class="${k && k.id === x.id ? "on" : ""}" onclick="askIn2('${x.id}')">${esc(subjectOf(x.subject).title)}</button>`).join("")}</div>` : ""}

    <div id="msgs" class="thread">${msgs.length ? msgs.map(msgHTML).join("")
      : `<div class="empty" style="border:none; background:none; padding:26px 0">
          <b>Ask anything from ${esc(k ? subjectOf(k.subject).title : "this subject")}</b>
          Type it in Nepali or English. Photos of a question work too.</div>`}</div>

    <div class="composer">
      ${msgs.length < 2 ? `<div class="sug">${sug.map(s =>
        `<button onclick="askThis(this.textContent)">${esc(s)}</button>`).join("")}</div>` : ""}
      <div class="cbox">
        <input id="ask" type="text" placeholder="Ask your doubt…" autocomplete="off"
          onkeydown="if(event.key==='Enter') send('${cur.id}')">
        <button class="cbtn" onclick="send('${cur.id}')" title="Send">→</button>
      </div>
      <div class="row" style="margin-top:10px">
        ${twoWayAsk(mode)}
        <span class="spacer"></span>
        <span class="small muted">${mode === "exam"
          ? "Answers written the way you would write them for marks."
          : "Plain explanation, as simple as it goes."}</span>
      </div>
    </div>`;
  return { html, crumbs:`<b>Ask</b>`, after:() => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; } };
}

function twoWayAsk(mode) {
  return `<div class="switch inline sm" style="margin:0">
    <button class="${mode === "explain" ? "on" : ""}" onclick="S.ask.mode='explain'; render()">Explain it</button>
    <button class="${mode === "exam" ? "on" : ""}" onclick="S.ask.mode='exam'; render()">Exam answer</button></div>`;
}
function askThis(text) { const i = $("#ask"); if (!i) return; i.value = text; i.focus(); }
function startAsk(cid) {
  const c = { id:uid("ch"), class:cid || askableClasses()[0].id, user:S.me.id, title:"New question", at:now() };
  DB.chats.unshift(c); S.ask.chat = c.id; render();
  setTimeout(() => { const i = $("#ask"); if (i) i.focus(); }, 40);
}
/* tapping a subject chip: carry on the last thread in it, or start one */
function askIn2(cid) {
  const had = DB.chats.find(c => c.user === S.me.id && c.class === cid);
  if (had) { S.ask.chat = had.id; render(); } else startAsk(cid);
}
function pastChats() {
  const mine = DB.chats.filter(c => c.user === S.me.id);
  openModal("Past questions", mine.length ? mine.map(c => {
    const first = DB.msgs.find(m => m.chat === c.id && m.from === "you");
    const k = classOf(c.class);
    return `<button class="tile click" style="width:100%; text-align:left; margin-bottom:9px; cursor:pointer"
      onclick="closeModal(); S.ask.chat='${c.id}'; location.hash='#/ask'; render()">
      <div class="row"><span class="chip">${esc(k ? subjectOf(k.subject).title : "")}</span>
        <span class="spacer"></span><span class="small muted">${fmtDate(c.at)}</span></div>
      <h3>${esc(c.title)}</h3>
      <div class="sub">${esc(first ? first.text.slice(0, 90) : "nothing asked yet")}</div></button>`;
  }).join("") : `<div class="empty"><b>Nothing yet</b>Your questions will be listed here.</div>`,
    `<button class="btn" onclick="closeModal()">Done</button>`);
}

function msgHTML(m) {
  if (m.from === "you") return `<div class="bwrap me"><div class="b me" id="t_${m.id}">${esc(m.text)}</div>
    <div class="bmeta">${fmtTime(m.at)}</div></div>`;
  return `<div class="bwrap ai"><div class="b ai" id="t_${m.id}">${esc(m.text)}</div>
    ${m.sources && m.sources.length ? `<div class="sources">${m.sources.map(s =>
      `<span class="chip">${esc(s.name)}, ${esc(s.where)}</span>`).join("")}</div>` : ""}
    <div class="row" style="gap:6px"><button class="btn quiet sm" onclick="keepAnswer('${m.id}')">Save this</button>
      <span class="bmeta">${fmtTime(m.at)}</span></div></div>`;
}
const REPLIES = [
  { when:/diffract|grating/i, text:"For a grating, (a + b) sin θ = nλ, where a + b is the distance from one slit to the next.\n\nGratings are usually given as lines per centimetre, so convert first. The slip to watch for is the highest order you can actually see: since sin θ can never exceed 1, n can never exceed (a + b)/λ.",
    sources:[{ name:"Physics notes, unit 1", where:"page 141" },{ name:"Past papers 2019–2025", where:"2022, question 9(a)" }] },
  { when:/lenz|induc|minus sign/i, text:"Faraday tells you how big the induced voltage is. Lenz tells you which way it pushes, and that is what the minus sign does: the induced current always opposes whatever change caused it.\n\nWhen a question asks for a direction, say what the flux is doing first, then say what current would fight that. Marks are usually split between those two statements.",
    sources:[{ name:"Physics notes, unit 1", where:"pages 88–90" }] },
  { when:/torque|turning|loop|angle/i, text:"τ = NIAB sin θ.\n\nThe part that costs marks is θ. It is the angle between the normal to the loop and the field, not between the plane of the loop and the field. Draw the normal on your diagram every time — it is the difference between full marks and half.",
    sources:[{ name:"Physics notes, unit 1", where:"pages 61–64" }] },
  { when:/k-?map|don.?t care/i, text:"Treat a don't-care as whatever makes your group bigger. It can join a group of ones to make a larger block, or you can ignore it. You are never obliged to cover one.\n\nMark them as X, find the largest legal blocks, and only then decide which X's you used.",
    sources:[{ name:"Logic design workbook", where:"page 24" }] }
];
function send(cid) {
  const box = $("#ask"), text = box.value.trim(); if (!text) return;
  box.value = "";
  const chat = DB.chats.find(c => c.id === cid);
  const um = { id:uid("g"), chat:cid, from:"you", text, at:now() };
  DB.msgs.push(um);
  let r = REPLIES.find(x => x.when.test(text)) || { text:"Here is the short version, from the material on this subject.\n\nStart with the law, write the equation, then put the numbers in. In past papers most of the marks sit with the statement rather than the arithmetic, so write it out in full before you calculate.",
    sources:[{ name:"Physics notes, unit 1", where:"pages 12–14" }] };
  if (S.ask.mode === "exam") r = { ...r, text:"Written the way the examiner wants it:\n\n" + r.text +
    "\n\nWrite the statement first, then the formula, then the numbers. Most of the marks are in the first two lines." };
  const am = { id:uid("g"), chat:cid, from:"tutor", text:"", at:now(), sources:r.sources };
  DB.msgs.push(am);
  const list = $("#msgs");
  list.insertAdjacentHTML("beforeend", msgHTML(um));
  list.insertAdjacentHTML("beforeend", msgHTML(am));
  list.scrollTop = list.scrollHeight;
  const el = document.getElementById("t_" + am.id), bits = r.text.split(/(?<=\s)/);
  let i = 0;
  const step = () => { if (!document.getElementById("t_" + am.id)) return;
    am.text += bits[i]; el.innerHTML = esc(am.text) + `<span class="cursor"></span>`;
    list.scrollTop = list.scrollHeight;
    if (++i < bits.length) setTimeout(step, 20);
    else { el.innerHTML = esc(am.text); chat.at = now(); nudge(chat.class, text); } };
  setTimeout(step, 240);
}
function nudge(cid, text) {
  const k = classOf(cid); if (!k) return;
  const hit = topicsOf(k.subject).find(t => text.toLowerCase().includes(t.name.toLowerCase().split(" ")[0]));
  if (!hit) return;
  const cur = (DB.mine[S.me.id] = DB.mine[S.me.id] || {});
  const was = cur[hit.id] || { e:null, c:null };
  cur[hit.id] = { e:was.e, c: was.c === null || was.c === undefined ? .5 : Math.min(1, was.c + .05) };
}
function keepAnswer(mid) {
  const m = DB.msgs.find(x => x.id === mid); if (!m) return;
  if (DB.kept.some(k => k.msg === mid)) { toast("Already kept"); return; }
  const chat = DB.chats.find(c => c.id === m.chat);
  DB.kept.unshift({ id:uid("k"), msg:mid, class:chat.class, text:m.text, sources:m.sources || [], at:now(), by:S.me.id });
  toast("Kept — find it under Kept answers"); render();
}
function dropKept(id) { DB.kept = DB.kept.filter(k => k.id !== id); toast("Removed"); keptModal(); }
function keptModal() {
  closeModal();
  const mine = DB.kept.filter(k => k.by === S.me.id);
  openModal("Kept answers", mine.length ? mine.map(k => `<div class="card pad" style="margin-bottom:10px">
      <div class="row"><span class="chip">${esc(subjectOf(classOf(k.class).subject).title)}</span><span class="spacer"></span>
        <button class="btn quiet sm" onclick="dropKept('${k.id}')">Remove</button></div>
      <div style="white-space:pre-wrap; margin-top:8px">${esc(k.text)}</div>
      ${k.sources.length ? `<div class="sources">${k.sources.map(s => `<span class="chip">${esc(s.name)}, ${esc(s.where)}</span>`).join("")}</div>` : ""}
    </div>`).join("") : `<div class="empty"><b>Nothing kept yet</b>Hit "Keep this" under any tutor answer.</div>`,
    `<button class="btn" onclick="closeModal()">Done</button>`);
}

/* ================= you ================= */
function pageSettings() {
  const p = S.me.prefs || (S.me.prefs = { language:"en", style:"exam_focused" });
  const seg = (id, opts, cur) => `<div class="switch" id="${id}">${opts.map(([v, l]) =>
    `<button class="${cur === v ? "on" : ""}" onclick="setPref('${id}','${v}')">${l}</button>`).join("")}</div>`;
  const student = S.me.role === "student";
  const html = `
    <div class="pagehead"><div><h1>You</h1><p>Two choices, and they change every answer the tutor gives you.</p></div></div>
    <div class="tiles two">
      <div class="tile"><h3>Your name</h3>
        <input id="p_n" type="text" value="${esc(S.me.name)}">
        <div class="foot"><button class="btn sm" onclick="saveSettings()">Save</button></div></div>
      <div class="tile"><h3>${student ? "You are a student" : "You are a teacher"}</h3>
        <div class="sub">${student
          ? `${myClasses().length} subjects · ${DB.results.filter(r => r.student === S.me.id).length} exams sat`
          : `${classesOfTeacher(S.me.id).filter(k => k.term === S.term).length} classes · ${new Set(classesOfTeacher(S.me.id).flatMap(k => studentsOfClass(k.id))).size} students`}</div></div>
    </div>

    <div class="sect"><div class="head"><h2>Language of answers</h2></div>
      ${seg("p_l", [["en", "English"], ["ne", "नेपाली"]], p.language)}</div>

    <div class="sect"><div class="head"><h2>How answers are written</h2></div>
      ${seg("p_a", [["concise", "Explain it simply"], ["exam_focused", "The way the exam wants it"]], p.style)}
      <div class="small muted" style="margin-top:8px">${p.style === "exam_focused"
        ? "Steps, marks and the wording examiners look for."
        : "Plain language first, formulas after."}</div></div>`;
  return { html, crumbs:"<b>You</b>" };
}
function setPref(which, v) {
  S.me.prefs = S.me.prefs || { language:"en", style:"exam_focused" };
  if (which === "p_l") S.me.prefs.language = v; else S.me.prefs.style = v;
  toast("Saved"); render();
}
function saveSettings() { const n = $("#p_n"); if (n && n.value.trim()) S.me.name = n.value.trim();
  toast("Saved"); render(); }
</script>
